'use strict';

const ctx = canvas.getContext('2d');
const W = 1600, H = 900;
canvas.width = W; canvas.height = H;
function resize() {
  const a = W/H;
  let w = innerWidth, h = innerHeight;
  if (w/h > a) w = h*a; else h = w/a;
  canvas.style.position = 'absolute';
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
  canvas.style.left = ((innerWidth-w)/2)+'px';
  canvas.style.top = ((innerHeight-h)/2)+'px';
}
window.addEventListener('resize', resize); resize();

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r==='number') r=[r,r,r,r];
    this.beginPath(); this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y); this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]); this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h); this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]); this.quadraticCurveTo(x,y,x+r[0],y);
    this.closePath(); return this;
  };
}

/* ============ AUDIO ============ */
let audioCtx = null;
function initAudio() { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
function playSound(freq, dur, type='square', vol=0.08) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function limbEnd(x,y,a,l){return{x:x+Math.cos(a)*l,y:y+Math.sin(a)*l}}
function circleOverlap(a,b){const dx=a.x-b.x,dy=a.y-b.y,r=a.r+b.r;return dx*dx+dy*dy<=r*r}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;
    if(p.life<=0){particles.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vy += (p.gravity || 600) * dt;
    p.vx*=0.95; p.vy*=0.98;
  }
  for(let i=lightningEffects.length-1; i>=0; i--){
    lightningEffects[i].life -= dt;
    if(lightningEffects[i].life <= 0) lightningEffects.splice(i, 1);
  }
  for(let i=explosionRings.length-1; i>=0; i--){
    const r = explosionRings[i];
    r.life -= dt;
    r.r += (r.maxR - r.r) * dt * 8;
    if(r.life <= 0) explosionRings.splice(i, 1);
  }
  for(let i=zombieWaves.length-1; i>=0; i--){
    const w = zombieWaves[i];
    w.life -= dt;
    w.r += (w.maxR - w.r) * dt * 10;
    if(w.life <= 0) zombieWaves.splice(i, 1);
  }
}

function updateEagles(dt){
  for(let i=eagles.length-1; i>=0; i--){
    const e = eagles[i];
    e.timer += dt;
    if(e.state === 'swoop'){
      e.y += 1500 * dt;
      if(e.target && !e.target.dead && e.y >= e.target.y - 80){
        e.target.takeDamage(10, e.owner.x < e.target.x ? 1 : -1);
        spawnHitSparks(e.x, e.y, '#ffdd00');
        e.state = 'fly';
        e.vy = -800;
      } else if(e.y > GROUND_Y) {
        e.state = 'fly';
        e.vy = -800;
      }
    } else {
      e.y += e.vy * dt;
      e.vy -= 500 * dt;
      e.x += (e.owner.x - e.x) * dt * 2;
      if(e.timer > 3) eagles.splice(i, 1);
    }
  }
}

/* ============ CROWD ============ */
function initCrowd(){
  const arenaW = ARENA_RIGHT - ARENA_LEFT;
  const count = 60;
  for(let row=0; row<3; row++){
    for(let i=0; i<count; i++){
      const x = ARENA_LEFT + 60 + i*(arenaW-120)/(count-1) + (Math.random()-0.5)*20;
      const y = GROUND_Y - 340 + row * 62;
      crowd.push({x,y,row,phase:Math.random()*Math.PI*2,hue:Math.floor(Math.random()*360),
        size:11+row*3,excited:0,alive:true,deathTimer:0,fallX:0,fallY:0,deathRotation:0});
    }
  }
}
function killRandomSpectator(){
  const alive=crowd.filter(c=>c.alive);
  if(!alive.length)return;
  const s=alive[Math.floor(Math.random()*alive.length)];
  s.alive=false;s.deathTimer=2.5;
  s.fallX=s.x+(Math.random()-0.5)*40;s.fallY=s.y+50+Math.random()*30;
  s.deathRotation=(Math.random()-0.5)*1.2;
  spawnBlood(s.x,s.y);playSound(300+Math.random()*200,0.15,'sawtooth',0.08);
}
function drawCrowd(t){
  for(const c of crowd){
    if(!c.alive){
      const prog=Math.min(1,(2.5-c.deathTimer)/1.2);
      const cx=c.x+(c.fallX-c.x)*prog, cy=c.y+(c.fallY-c.y)*prog;
      ctx.save(); ctx.translate(cx,cy);
      ctx.rotate((c.deathRotation||0)+prog*Math.PI*0.65);
      ctx.fillStyle=`hsl(${c.hue},20%,12%)`;
      ctx.beginPath(); ctx.arc(0,0,c.size,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=`hsl(${c.hue},10%,30%)`;
      ctx.beginPath(); ctx.arc(0,-c.size*0.9,c.size*0.65,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(160,0,0,0.75)';
      ctx.beginPath(); ctx.ellipse(0,c.size*0.5,c.size*1.5,c.size*0.4,0,0,Math.PI*2); ctx.fill();
      ctx.restore(); continue;
    }
    const bob=Math.sin(t*2+c.phase)*2+c.excited*Math.sin(t*15+c.phase)*8;
    ctx.fillStyle=`hsl(${c.hue},60%,${28+c.row*5}%)`;
    ctx.beginPath(); ctx.arc(c.x,c.y+bob,c.size,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`hsl(${c.hue},40%,${55+c.row*5}%)`;
    ctx.beginPath(); ctx.arc(c.x,c.y+bob-c.size*0.9,c.size*0.65,0,Math.PI*2); ctx.fill();
  }
}

/* ============ FIGHTER ============ */
class Fighter {
  constructor(x,facing,charType,name,controls){
    this.x=x; this.y=GROUND_Y; this.facing=facing;
    this.charType=charType;
    this.isUkraine=charType==='ukraine';
    this.isAmerica=charType==='america';
    this.colors = this.isUkraine ? UKRAINE_COLORS : (this.isAmerica ? AMERICAN_COLORS : RUSSIA_COLORS);
    this.name=name; this.controls=controls;
    this.hp=100; this.maxHp=100;
    this.vx=0; this.vy=0; this.onGround=true;
    this.state='idle'; this.animTime=0;
    this.attack=null; this.hitstun=0; this.hitFlash=0;
    this.blocking=false; this.specialCd=0;
    this.walkCycle=0; this.koTimer=0;
    this.skillCd={ drone:0, missile:0, bombs:0, blockade:0, bear:0, uppercut:0, flag:0, eagle:0, burger:0 };
    this.blockedTimer=0;
    this.carried=false;
    this.doubleJumpUsed=false; this.doubleJumpCd=0;
    this.dashTimer=0; this.dashCd=0; this.dashDir=0; this.dashTrail=[];
    
    this.ultUsed=false;
    this.ultTimer=0;
    this.zombieWaveTimer=0;
    this.ultCharging=false;
    this.ultChargeTimer=0;
    this.ultChargeDuration=this.isAmerica ? 4.0 : ULT_CHARGE_TIME;
    this._ultKeyHeld=false;
    this.shieldHp=100;
    this.shieldBroken=false;
    
    this.dropCooldown=0;
    this.breathing=Math.random()*Math.PI*2;
    this.bleedTimer=0;
    this.bleedTickTimer=0;
    this.healTicks=0;
    this.healTimer=0;

    this.isAI = false;
    this.aiKeys = {};
    this.aiTimer = 0;
  }
  reset(){
    this.maxHp = 100;
    this.hp = 100;
    this.vx=0; this.vy=0;
    this.onGround=true; this.state='idle';
    this.attack=null; this.hitstun=0; this.hitFlash=0;
    this.blocking=false; this.specialCd=0;
    this.koTimer=0; this.y=GROUND_Y;
    this.skillCd={ drone:0, missile:0, bombs:0, blockade:0, bear:0, uppercut:0, flag:0, eagle:0, burger:0 };
    this.blockedTimer=0; this.carried=false;
    this.doubleJumpUsed=false; this.doubleJumpCd=0;
    this.dashTimer=0; this.dashCd=0; this.dashTrail=[];
    this.ultUsed=false; this.ultTimer=0; this.zombieWaveTimer=0;
    this.ultCharging=false; this.ultChargeTimer=0; this._ultKeyHeld=false;
    this.ultChargeDuration=this.isAmerica ? 4.0 : ULT_CHARGE_TIME;
    this.shieldHp=100; this.shieldBroken=false;
    this.dropCooldown=0;
    this.animTime = 0;
    this.walkCycle = 0;
    this.breathing = 0;
    this.bleedTimer=0;
    this.bleedTickTimer=0;
    this.healTicks=0;
    this.healTimer=0;
    this.aiKeys = {};
    this.aiTimer = 0;
  }
  getSkillCd(name){
    let cd = (SKILLS[name] ? SKILLS[name].cd : (SKILLS_RU[name] ? SKILLS_RU[name].cd : (SKILLS_US[name] ? SKILLS_US[name].cd : 0)));
    return cd;
  }
  castFlag(){
    projectiles.push({
      x:this.x+this.facing*50, y:this.y-90,
      vx:this.facing*1200, vy:0, r:24, damage:12,
      owner:this, color:'#d52b1e', type:'flag', trail:[],
    });
    spawnMuzzleFlash(this.x+this.facing*55,this.y-90,this.facing);
    doShake(6,0.1);
    playSound(400,0.15,'triangle',0.1);
  }
  castEagle(){
    const target = this===p1 ? p2 : p1;
    eagles.push({
      x: target.x + (Math.random()-0.5)*100,
      y: -200,
      target: target,
      owner: this,
      state: 'swoop',
      timer: 0,
    });
    playSound(800,0.2,'triangle',0.1);
    playSound(1200,0.1,'sine',0.1);
  }
  castBurger(){
    this.healTicks = 3;
    this.healTimer = 0.7;
    particles.push({x:this.x, y:this.y-200, vx:0, vy:-40, life:1.0, maxLife:1.0, color:'#55ff55', size:26, isText:true, text:'🍔 БУРГЕР!'});
    playSound(600, 0.2, 'sine', 0.08);
  }
  update(dt,opponent,allowInput){
    this.animTime+=dt;
    this.hitFlash=Math.max(0,this.hitFlash-dt*4);
    this.specialCd=Math.max(0,this.specialCd-dt);
    this.blockedTimer=Math.max(0,this.blockedTimer-dt);
    this.dropCooldown=Math.max(0,this.dropCooldown-dt);
    this.dashCd=Math.max(0,this.dashCd-dt);
    this.doubleJumpCd=Math.max(0,this.doubleJumpCd-dt);
    for(const k in this.skillCd) this.skillCd[k]=Math.max(0,this.skillCd[k]-dt);

    if(this.carried){ this.state='carried'; return; }

    // Сброс флага удержания ульты
    if (!this.isDown(this.controls.ult)) {
      this._ultKeyHeld = false;
    }

    // Запуск зарядки ульты для всех персонажей
    if(allowInput && this.isDown(this.controls.ult) && !this.ultUsed && !this.ultCharging && this.hp > 0 && !this._ultKeyHeld){
      this.ultChargeDuration = this.isAmerica ? 4.0 : ULT_CHARGE_TIME;
      this.ultCharging = true;
      this.ultChargeTimer = 0;
      this._ultKeyHeld = true;
      this.vx = 0;
      this.state = 'ult_charge';
      playSound(300, 0.3, 'sawtooth', 0.1);
      particles.push({x:this.x, y:this.y-200, vx:0, vy:-40, life:1.5, maxLife:1.5,
        color:'#ffcc00', size:24, isText:true, text:'ЗАРЯДКА УЛЬТЫ!'});
    }

    // Обработка зарядки ульты
    if(this.ultCharging) {
      this.ultChargeTimer += dt;
      this.state = 'ult_charge';
      this.vx = 0;
      if(this.isAmerica && this.ultChargeTimer >= 2 && Math.random() < 0.65){
        const a=Math.random()*Math.PI*2, r=45+Math.random()*75;
        particles.push({x:this.x+Math.cos(a)*r,y:this.y-110+Math.sin(a)*r,
          vx:Math.cos(a)*-100,vy:-120-Math.random()*100,life:0.55,maxLife:0.55,
          color:['#ffffff','#55aaff','#ff4444','#ffd700'][Math.floor(Math.random()*4)],size:4+Math.random()*5});
      }
      
      // Частицы зарядки
      if (Math.random() < 0.7) {
        if (this.isUkraine) {
          // Синие электрические искры
          const angle = Math.random() * Math.PI * 2;
          const r = 30 + Math.random() * 80;
          particles.push({
            x: this.x + Math.cos(angle) * r,
            y: this.y - 80 + Math.sin(angle) * r,
            vx: Math.cos(angle) * -180,
            vy: Math.sin(angle) * -180 - 100,
            life: 0.5, maxLife: 0.5,
            color: ['#88ccff','#ffffff','#aaddff','#ffff00'][Math.floor(Math.random()*4)],
            size: 3 + Math.random() * 5,
          });
        } else {
          // Красные огненные искры
          const angle = Math.random() * Math.PI * 2;
          const r = 20 + Math.random() * 60;
          particles.push({
            x: this.x + Math.cos(angle) * r,
            y: this.y - 80 + Math.sin(angle) * r,
            vx: Math.cos(angle) * -150,
            vy: Math.sin(angle) * -150 - 80,
            life: 0.5, maxLife: 0.5,
            color: ['#ff4400','#ffcc00','#ffffff','#ff8800'][Math.floor(Math.random()*4)],
            size: 3 + Math.random() * 5,
          });
        }
      }
      
      // Нарастающая тряска
      const shakeI = 3 + (this.ultChargeTimer / this.ultChargeDuration) * 20;
      doShake(shakeI, 0.08);
      
      if(this.ultChargeTimer >= this.ultChargeDuration) {
        this.ultCharging = false;
        triggerUlt(this, opponent);
      }
      this.applyGravity(dt);
      return;
    }

    if(this.ultTimer>0){
      this.ultTimer -= dt;
      if(this.isUkraine){
        this.zombieWaveTimer -= dt;
        if(this.zombieWaveTimer <= 0){
          this.zombieWaveTimer = 0.6;
          if(opponent && !opponent.dead){
            const dist = Math.hypot(opponent.x - this.x, opponent.y - this.y);
            if(dist < 320){
              opponent.takeDamage(4, opponent.x > this.x ? 1 : -1);
            }
          }
          zombieWaves.push({x:this.x, y:this.y-40, r:30, maxR:320, life:0.5, maxLife:0.5});
          playSound(150, 0.12, 'sawtooth', 0.08);
          doShake(6, 0.1);
        }
      }
    }

    if(this.bleedTimer > 0){
      this.bleedTimer -= dt;
      this.bleedTickTimer -= dt;
      if(this.bleedTickTimer <= 0){
        this.bleedTickTimer = 0.5;
        this.takeDamage(2, -this.facing);
        spawnKetchup(this.x, this.y-80, -this.facing, 3);
      }
    }

    if(this.healTicks > 0){
      this.healTimer -= dt;
      if(this.healTimer <= 0){
        this.healTimer = 0.7;
        this.healTicks--;
        this.hp = Math.min(this.maxHp, this.hp + 5);
        for(let i=0; i<10; i++){
          const a = Math.random()*Math.PI*2, s = 50+Math.random()*150;
          particles.push({x:this.x, y:this.y-80, vx:Math.cos(a)*s, vy:Math.sin(a)*s-50, life:0.6, maxLife:0.6, color:'#55ff55', size:4+Math.random()*4});
        }
        particles.push({x:this.x, y:this.y-100, vx:0, vy:-50, life:1.0, maxLife:1.0, color:'#55ff55', size:20, isText:true, text:'+5 HP'});
        playSound(800, 0.1, 'sine', 0.08);
      }
    }

    if(this.hp>0 && !this.attack && this.hitstun<=0){
      const wantL = this.isDown(this.controls.left);
      const wantR = this.isDown(this.controls.right);
      if(wantL && !wantR) this.facing = -1;
      else if(wantR && !wantL) this.facing = 1;
    }

    if(this.hp<=0){
      this.koTimer+=dt; this.applyGravity(dt);
      this.x+=this.vx*dt; this.vx*=0.9;
      this.clampX(); return;
    }
    if(this.hitstun>0){
      this.hitstun-=dt; this.x+=this.vx*dt; this.vx*=0.85;
      if(this.hitstun<=0) this.state='idle';
      this.clampX(); this.applyGravity(dt); return;
    }
    if(this.attack){
      this.updateAttack(dt,opponent);
      this.applyGravity(dt);
      this.x+=this.vx*dt; this.vx*=0.9;
      this.clampX(); return;
    }
    if(this.dashTimer>0){
      this.dashTimer -= dt;
      this.vx = this.dashDir * DASH_SPEED;
      this.x += this.vx * dt;
      this.clampX();
      this.applyGravity(dt);
      this.dashTrail.push({x:this.x, y:this.y, life:0.3, maxLife:0.3});
      this.state = this.onGround ? 'dash' : 'dash_air';
      return;
    }

    let moving=false;
    if(allowInput){
      const cd = this.skillCd;
      if(this.blockedTimer <= 0){
        if (this.isUkraine) {
          if(this.isDown(this.controls.skill1) && cd.drone<=0){ launchDrone(this); cd.drone=SKILLS.drone.cd; playSound(800,0.15,'triangle',0.08); }
          if(this.isDown(this.controls.skill2) && cd.missile<=0){ launchMissile(this); cd.missile=SKILLS.missile.cd; playSound(300,0.3,'sawtooth',0.1); }
          if(this.isDown(this.controls.skill3) && cd.bombs<=0){ this.castBombs(); cd.bombs=SKILLS.bombs.cd; }
        } else if (this.isAmerica) {
          if(this.isDown(this.controls.skill1) && cd.flag<=0){ this.castFlag(); cd.flag=SKILLS_US.flag.cd; }
          if(this.isDown(this.controls.skill2) && cd.eagle<=0){ this.castEagle(); cd.eagle=SKILLS_US.eagle.cd; }
          if(this.isDown(this.controls.skill3) && cd.burger<=0){ this.castBurger(); cd.burger=SKILLS_US.burger.cd; }
        } else if (!this.isChina) {
          if(this.isDown(this.controls.skill1) && cd.blockade<=0){ this.castBlockade(); cd.blockade=SKILLS_RU.blockade.cd; }
          if(this.isDown(this.controls.skill2) && cd.bear<=0){ this.castBearSkill(); cd.bear=SKILLS_RU.bear.cd; }
          if(this.isDown(this.controls.skill3) && cd.uppercut<=0){ this.startAttack('uppercut'); cd.uppercut=SKILLS_RU.uppercut.cd; }
        }
      }
      if(this.isDown(this.controls.dash) && this.dashCd<=0){
        this.startDash();
      }

      const flying = this.isAmerica && this.ultTimer > 0;
      const wantS = this.isDown(this.controls.block);
      const wantMove = this.isDown(this.controls.left) || this.isDown(this.controls.right);
      if(wantS && (this.onGround || flying) && (!wantMove || flying)){
        if(flying){ this.blocking = true; }
        else {
        const onPlat = this.getStandingPlatform();
        if(onPlat){
          this.onGround = false; this.vy = 60;
          this.dropCooldown = 0.35; this.blocking = false;
          this.doubleJumpUsed = false;
        } else {
          this.blocking = true;
        }
        }
      } else {
        this.blocking = false;
      }

      if(!this.blocking){
        if(this.isDown(this.controls.left)){ this.vx=-MOVE_SPEED*(this.facing>0?0.7:1); moving=true; }
        else if(this.isDown(this.controls.right)){ this.vx=MOVE_SPEED*(this.facing<0?0.7:1); moving=true; }
        else this.vx=0;

        if(this.isDown(this.controls.jump)){
          if(this.onGround && !this._jumpHeld){
            this.vy=JUMP_VELOCITY; this.onGround=false;
            this.doubleJumpUsed=false;
            spawnDust(this.x, this.y, 4);
            playSound(400,0.06,'sine',0.03);
            this._jumpHeld = true;
          } else if(!this.onGround && !this.doubleJumpUsed && !this._jumpHeld){
            this.vy = DOUBLE_JUMP_VELOCITY;
            this.doubleJumpUsed = true;
            this.doubleJumpCd = 3;
            for(let i=0;i<10;i++){
              const a = Math.random()*Math.PI*2, s = 80+Math.random()*150;
              particles.push({x:this.x,y:this.y-30,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,
                life:0.4,maxLife:0.4,color:'#aaddff',size:4+Math.random()*4});
            }
            playSound(600,0.08,'sine',0.05);
            this._jumpHeld = true;
          }
        } else {
          this._jumpHeld = false;
        }

        if(this.isDown(this.controls.punch)) this.startAttack('punch');
        else if(this.isDown(this.controls.kick)) this.startAttack('kick');
        else if(this.isDown(this.controls.special) && this.specialCd<=0){
          this.startAttack('chargedPunch');
          this.specialCd = ATTACKS.chargedPunch.cd;
        }
      } else if(flying){
        // Во время полёта можно двигаться по горизонтали, не опуская щит
        if(this.isDown(this.controls.left)){ this.vx=-MOVE_SPEED*(this.facing>0?0.7:1); moving=true; }
        else if(this.isDown(this.controls.right)){ this.vx=MOVE_SPEED*(this.facing<0?0.7:1); moving=true; }
        else this.vx=0;
      }
    } else { this.blocking=false; this.vx=0; }

    this.x+=this.vx*dt;
    this.clampX();
    if(this.isAmerica && this.ultTimer > 0){
      const rise=this.isDown(this.controls.jump);
      const descend=this.isDown(this.controls.block);
      const flySpeed=MOVE_SPEED*1.55;
      if(rise && !descend) this.y-=flySpeed*dt;
      else if(descend) this.y+=flySpeed*dt;
      this.y=Math.max(120,Math.min(GROUND_Y,this.y));
      this.onGround=this.y>=GROUND_Y-1;
      this.vy=0;
    } else {
      this.applyGravity(dt);
    }

    if(!this.onGround) this.state = 'jump';
    else if(this.blocking) this.state='block';
    else if(moving){ this.state='walk'; this.walkCycle+=dt*10; }
    else { this.state='idle'; this.breathing+=dt*3; }
  }
  startDash(){
    this.dashTimer = DASH_DURATION;
    this.dashCd = DASH_CD;
    this.dashDir = this.facing;
    this.vy = 0;
    this.dashTrail = [];
    playSound(500,0.1,'sine',0.06);
    playSound(700,0.08,'triangle',0.04);
  }
  getStandingPlatform(){
    for(const plat of platforms){
      if(Math.abs(this.y - plat.y) < 5 && this.x + 25 > plat.x && this.x - 25 < plat.x + plat.w){
        return plat;
      }
    }
    return null;
  }
  castBlockade(){
    projectiles.push({
      x:this.x+this.facing*50, y:this.y-90,
      vx:this.facing*900, vy:0, r:16, damage:5,
      owner:this, color:'#cc66ff', type:'blockade', trail:[],
    });
    spawnMuzzleFlash(this.x+this.facing*55,this.y-90,this.facing);
    doShake(5,0.1);
    playSound(400,0.15,'triangle',0.1);
    playSound(600,0.1,'sawtooth',0.08);
  }
  castBearSkill(){
    const startX = this.x + this.facing*40;
    bears.push({
      x: Math.max(ARENA_LEFT+80, Math.min(ARENA_RIGHT-80, startX)),
      y: this.y, facing: this.facing, vx: this.facing*650,
      owner: this, target: this===p1 ? p2 : p1,
      carrying:null, life:1.2, animTime:0,
    });
    spawnDust(this.x,this.y,15);
    doShake(10,0.2);
    playSound(60,0.4,'sawtooth',0.15);
    particles.push({x:this.x, y:this.y-180, vx:0, vy:-40, life:1.0, maxLife:1.0, color:'#ffaa44', size:28, isText:true, text:'МЕДВЕДЬ!'});
  }
  castBombs(){
    const dir = this.facing;
    for(let i=0; i<5; i++){
      bombs.push({
        x: this.x + dir*(80 + i*90 + Math.random()*60),
        y: this.y - 900 - i*90 - Math.random()*80,
        vx: dir*50, vy: 0,
        spin: Math.random()*Math.PI*2,
        target: this===p1 ? p2 : p1,
        owner: this, damage: 15, exploded: false, life: 6,
      });
    }
    doShake(6, 0.15);
    playSound(200, 0.4, 'sawtooth', 0.08);
    playSound(80, 0.3, 'square', 0.1);
    particles.push({x:this.x, y:this.y-200, vx:0, vy:-40, life:1.2, maxLife:1.2, color:'#ff8800', size:26, isText:true, text:'💣 БОМБЫ!'});
  }
  applyGravity(dt){
    if(this.isAmerica && this.ultTimer > 0){ this.vy=0; this.onGround=false; return; }
    if(this.onGround){
      if(this.y >= GROUND_Y - 2) return;
      if(!this.getStandingPlatform()) this.onGround = false;
      else return;
    }
    this.vy += GRAVITY * dt;
    const prevY = this.y;
    this.y += this.vy * dt;

    if(this.vy > 0 && this.dropCooldown <= 0){
      for(const plat of platforms){
        if(this.x + 25 > plat.x && this.x - 25 < plat.x + plat.w){
          if(prevY <= plat.y && this.y >= plat.y){
            this.y = plat.y; this.vy = 0; this.onGround = true;
            this.doubleJumpUsed = false; this.doubleJumpCd = 0;
            spawnDust(this.x, plat.y, 4);
            return;
          }
        }
      }
    }

    if(this.y >= GROUND_Y){
      let onSpring = false;
      for(const s of springs){
        if(Math.abs(this.x - s.x) < 45){
          onSpring = true;
          this.vy = -1500;
          this.onGround = false;
          this.doubleJumpUsed = false;
          spawnDust(this.x, GROUND_Y, 12);
          playSound(300, 0.15, 'sine', 0.08);
          playSound(800, 0.1, 'triangle', 0.05);
          break;
        }
      }
      if(!onSpring){
        this.y = GROUND_Y; this.vy = 0; this.onGround = true;
        this.doubleJumpUsed = false; this.doubleJumpCd = 0;
        if(Math.abs(prevY - GROUND_Y) > 30) spawnDust(this.x, GROUND_Y, 5);
      }
    }
  }
  clampX(){ this.x = Math.max(ARENA_LEFT+30, Math.min(ARENA_RIGHT-30, this.x)); }
  startAttack(type){
    const cfg = ATTACKS[type] || ATTACKS.punch;
    this.attack = {type, timer:0,
      totalTime: cfg.startup+cfg.active+cfg.recovery,
      startupEnd: cfg.startup, activeEnd: cfg.startup+cfg.active,
      hasHit:false, spawned:false};
    if(type==='punch') playSound(180,0.05,'square',0.05);
    else if(type==='kick') playSound(140,0.07,'square',0.06);
    else if(type==='uppercut') playSound(120,0.1,'sawtooth',0.12);
    else if(type==='chargedPunch'){
      playSound(150,0.3,'sawtooth',0.1);
      particles.push({x:this.x, y:this.y-200, vx:0, vy:-40, life:1.2, maxLife:1.2,
        color:'#ffaa00', size:24, isText:true, text:'ЗАРЯД...'});
    }
  }
  updateAttack(dt,opponent){
    const a=this.attack; a.timer+=dt;
    let phase;
    if(a.timer<a.startupEnd) phase='startup';
    else if(a.timer<a.activeEnd) phase='active';
    else phase='recovery';

    if(a.type==='chargedPunch' && phase==='startup'){
      if(Math.random() < 0.6){
        const angle = Math.random()*Math.PI*2;
        const r = 40 + Math.random()*60;
        particles.push({
          x: this.x + Math.cos(angle)*r + this.facing*30,
          y: this.y - 90 + Math.sin(angle)*r,
          vx: -Math.cos(angle)*180, vy: -Math.sin(angle)*180,
          life: 0.35, maxLife: 0.35,
          color: Math.random()<0.5 ? '#ffcc00' : '#ff8800', size: 3 + Math.random()*4,
        });
      }
    }

    if(phase==='active' && !a.hasHit){
      if(a.type==='punch'||a.type==='kick'||a.type==='uppercut'||a.type==='chargedPunch'){
        const cfg=ATTACKS[a.type];
        const hb={x:this.x+this.facing*cfg.range, y:this.y+cfg.hitY, r:cfg.hitR};
        if(circleOverlap(hb, opponent.getHurtbox())){
          opponent.takeDamage(cfg.damage, this.facing);
          if(cfg.knockback) opponent.vx = this.facing*cfg.knockback;
          if(cfg.launch){ opponent.vy = -900; opponent.onGround = false; }
          a.hasHit = true;
          spawnHitSparks(hb.x, hb.y, '#ffff88');
          doShake(a.type==='chargedPunch'?30 : a.type==='uppercut'?16 : a.type==='kick'?10 : 6,
            a.type==='chargedPunch'?0.35 : 0.15);
          hitStopTimer = a.type==='chargedPunch'?0.15 : 0.06;
          for(const c of crowd) c.excited = a.type==='chargedPunch'?3 : 1.5;
          playSound(a.type==='chargedPunch'?80 : 200, 0.15, 'square', 0.12);
          if(a.type==='chargedPunch'){
            flash('rgba(255,200,0,0.4)');
            particles.push({x:hb.x, y:hb.y, vx:0, vy:-60, life:1.0, maxLife:1.0,
              color:'#ffaa00', size:32, isText:true, text:'БУМ!'});
          }
          if(Math.random()<0.35) killRandomSpectator();
        }
      }
    }
    if(a.timer >= a.totalTime) this.attack = null;
  }
  getHurtbox(){ return {x:this.x, y:this.y-80, r:42}; }
  isDown(code){
    if (this.isAI) {
        if(Array.isArray(code)) return code.some(c=>this.aiKeys[c]===true);
        return this.aiKeys[code]===true;
    }
    if(Array.isArray(code)) return code.some(c=>keys[c]===true);
    return keys[code]===true;
  }
  takeDamage(dmg, dir){
    // Последние две секунды превращения Америки неуязвимы
    if(this.isAmerica && this.ultCharging && this.ultChargeTimer >= 2) return;

    // Щит Капитана Америки поглощает первые 100 единиц урона при блоке
    if(this.isAmerica && this.ultTimer > 0 && this.blocking && this.shieldHp > 0){
      const absorbed=Math.min(dmg,this.shieldHp);
      this.shieldHp-=absorbed;
      dmg-=absorbed;
      spawnHitSparks(this.x-this.facing*35,this.y-100,'#55bbff');
      playSound(520,0.07,'triangle',0.09);
      if(this.shieldHp<=0 && !this.shieldBroken){
        this.shieldHp=0; this.shieldBroken=true;
        particles.push({x:this.x,y:this.y-150,vx:0,vy:-45,life:1.2,maxLife:1.2,color:'#ffcc44',size:24,isText:true,text:'ЩИТ СЛОМАН!'});
        doShake(10,0.18);
      }
      if(dmg<=0) return;
    }

    // Прерывание зарядки ульты
    if (this.ultCharging) {
      this.ultCharging = false;
      this.ultChargeTimer = 0;
      if (this.state === 'ult_charge') this.state = 'idle';
      particles.push({x:this.x, y:this.y-200, vx:0, vy:-40, life:1.0, maxLife:1.0,
        color:'#ff4444', size:24, isText:true, text:'ПРЕРВАНО!'});
      playSound(200, 0.2, 'sawtooth', 0.1);
    }
    
    if(this.ultTimer > 0 && !this.isUkraine){
      dmg *= 0.5;
    }
    if(this.blocking && this.onGround && !(this.isAmerica && this.ultTimer > 0)){
      this.hp -= dmg*0.15;
      this.hitFlash = Math.max(this.hitFlash, 0.3);
      spawnHitSparks(this.x-dir*20, this.y-80, '#88aaff');
      playSound(400,0.05,'triangle',0.06); return;
    }
    this.hp -= dmg;
    this.hitFlash = 0.5;
    this.hitstun = Math.min(0.4, dmg*0.04);
    this.vx = dir*(150+dmg*15);
    this.state = 'hit';
    spawnHitSparks(this.x, this.y-80, '#ff8888');
    spawnKetchup(this.x, this.y-80, dir, Math.min(18, 4 + Math.floor(dmg)));
    playSound(250,0.08,'sawtooth',0.08);
    if(this.attack && this.attack.type==='chargedPunch'){
      this.attack = null;
      particles.push({x:this.x, y:this.y-140, vx:0, vy:-40, life:0.8, maxLife:0.8,
        color:'#ff4444', size:20, isText:true, text:'ПРЕРВАНО'});
    }
    if(this.hp<=0){
      this.hp=0; this.state='ko'; this.vx=dir*200;
      doShake(25,0.3); playSound(100,0.6,'sawtooth',0.15);
      for(let k=0;k<3;k++) killRandomSpectator();
    }
  }
}

/* ============ ULTIMATES ============ */
function triggerUlt(f, opp){
  if(f.ultUsed) return;
  f.ultUsed = true;
  f.state = 'idle'; f.hitstun = 0; f.attack = null;

  if(f.isAmerica){
    f.ultTimer=8;
    f.shieldHp=100; f.shieldBroken=false;
    f.vx=0; f.vy=0;
    // Эффект приземления и вспышка превращения
    spawnDust(f.x, f.y, 18);
    for(let i=0;i<34;i++){
      const a=Math.random()*Math.PI*2, sp=100+Math.random()*360;
      particles.push({x:f.x,y:f.y-110,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,
        life:0.8+Math.random()*0.4,maxLife:1.2,color:['#ffffff','#55aaff','#ff4444','#ffd700'][Math.floor(Math.random()*4)],size:4+Math.random()*7});
    }
    particles.push({x:f.x,y:f.y-250,vx:0,vy:-50,life:1.8,maxLife:1.8,color:'#ffd700',size:44,isText:true,text:'КАПИТАН АМЕРИКА!'});
    flash('rgba(255,255,255,0.8)'); doShake(28,0.45);
    playSound(880,0.25,'triangle',0.13); playSound(440,0.4,'sine',0.1);
    for(const c of crowd) c.excited=3;
    return;
  }

  if(f.isUkraine){
    f.ultTimer = 6;

    particles.push({x:f.x, y:f.y-260, vx:0, vy:-60, life:2.0, maxLife:2.0,

  } else {

    if(opp && !opp.dead){
      const dir = opp.x > f.x ? 1 : -1;
      opp.takeDamage(15, dir);
      opp.vx = dir * 2400;
      opp.vy = -1500;
      opp.onGround = false;
      opp.hitstun = 1.5;
    }
    doShake(38, 0.6);
    playSound(50,0.7,'sawtooth',0.3);
    playSound(1400,0.3,'square',0.15);
    playSound(80,0.5,'square',0.2);

      color:'#ffaa00', size:22, isText:true, text:'-50% УРОНА'});
    for(const c of crowd) c.excited = 3;
    for(let k=0;k<3;k++) killRandomSpectator();
  }
}

/* ============ AI LOGIC ============ */
function updateAI(ai, player) {
    ai.aiKeys = {};
    if (ai.hp <= 0 || ai.state === 'hit' || ai.state === 'ko' || ai.carried || ai.ultCharging) return;
    
    const dist = Math.abs(ai.x - player.x);
    const dir = player.x > ai.x ? 1 : -1;
    
    if (player.y < ai.y - 100 && ai.onGround) {
        ai.aiKeys['ArrowUp'] = true;
    }
    else if (player.y > ai.y + 50 && ai.onGround) {
        ai.aiKeys['ArrowDown'] = true;
    }
    
    // Ультимейт с зарядкой (только если не Америка)
    if (!ai.ultUsed && (ai.hp < ai.maxHp * 0.5 || Math.random() < 0.02)) {
        ai.aiKeys['Numpad0'] = true;
        return;
    }
    
    if (player.attack && dist < 150 && Math.random() < 0.6) {
        ai.aiKeys['ArrowDown'] = true;
        return;
    }
    
    if (ai.blockedTimer <= 0) {
        if (ai.isAmerica && ai.hp < ai.maxHp * 0.7 && ai.skillCd.burger <= 0) {
            ai.aiKeys['Numpad3'] = true;
        }
        if (dist > 200 && dist < 1000) {
            if (ai.isAmerica && ai.skillCd.flag <= 0) ai.aiKeys['Numpad1'] = true;
            else if (ai.isUkraine && ai.skillCd.missile <= 0) ai.aiKeys['Numpad2'] = true;
            else if (ai.isUkraine && ai.skillCd.drone <= 0) ai.aiKeys['Numpad1'] = true;
            else if (!ai.isUkraine && !ai.isAmerica && ai.skillCd.blockade <= 0) ai.aiKeys['Numpad1'] = true;
        }
        if (dist < 150) {
            if (!ai.isUkraine && ai.skillCd.uppercut <= 0 && Math.random() < 0.3) ai.aiKeys['Numpad3'] = true;
            else if (ai.isUkraine && ai.skillCd.bombs <= 0 && Math.random() < 0.3) ai.aiKeys['Numpad3'] = true;
            else if (!ai.isUkraine && !ai.isAmerica && ai.skillCd.bear <= 0 && Math.random() < 0.3) ai.aiKeys['Numpad2'] = true;
        }
    }
    
    if (dist < 90 && !ai.attack && !ai.aiKeys['Numpad3'] && !ai.aiKeys['Numpad2']) {
        if (Math.random() < 0.15) ai.aiKeys['Numpad6'] = true;
        else if (Math.random() < 0.4) ai.aiKeys['Numpad4'] = true;
        else if (Math.random() < 0.4) ai.aiKeys['Numpad5'] = true;
    }
    
    if (!ai.attack && !ai.blocking && !ai.aiKeys['Numpad4'] && !ai.aiKeys['Numpad5'] && !ai.aiKeys['Numpad6']) {
        if (dist > 80) {
            if (dir > 0) ai.aiKeys['ArrowRight'] = true;
            else ai.aiKeys['ArrowLeft'] = true;
            
            if (Math.random() < 0.05 && ai.onGround) ai.aiKeys['ArrowUp'] = true;
            if (Math.random() < 0.05 && ai.dashCd <= 0) ai.aiKeys['ShiftRight'] = true;
        } else {
            if (Math.random() < 0.3) {
                if (dir > 0) ai.aiKeys['ArrowLeft'] = true;
                else ai.aiKeys['ArrowRight'] = true;
            }
        }
    }
}

/* ============ Drones / Missile ============ */
function launchDrone(owner){
  drones.push({x:owner.x,y:owner.y-160,owner,target:owner===p1?p2:p1,fireTimer:0.3,life:3.5,rotor:0});
}
function launchMissile(owner){
  const target = owner===p1 ? p2 : p1;
  projectiles.push({x:owner.x,y:owner.y-350,vx:0,vy:0,r:12,damage:20,owner,color:'#ff5544',
    type:'missile',target,homing:true,trail:[]});
}
function updateDrones(dt){
  for(let i=drones.length-1;i>=0;i--){
    const d=drones[i]; d.life-=dt; d.rotor+=dt*30;
    if(d.target && !d.target.dead){
      const tx=d.target.x, ty=d.target.y-170;
      const dx=tx-d.x, dy=ty-d.y;
      const dist=Math.hypot(dx,dy);
      if(dist>5){ const sp=Math.min(dist,400*dt); d.x+=dx/dist*sp; d.y+=dy/dist*sp; }
      d.fireTimer-=dt;
      if(d.fireTimer<=0 && d.life>0){
        d.fireTimer=0.4;
        const hx=d.target.x, hy=d.target.y-80;
        const fdx=hx-d.x, fdy=hy-d.y;
        const fd=Math.hypot(fdx,fdy)||1;
        projectiles.push({x:d.x,y:d.y,vx:fdx/fd*1200,vy:fdy/fd*1200,r:5,damage:3,
          owner:d.owner,color:'#ffcc00',type:'drone_bullet',trail:[]});
        playSound(700,0.03,'square',0.03);
      }
    }
    if(d.life<=0){ if(d.ultBomb && d.target && d.target.hp>0 && Math.hypot(d.target.x-d.x,d.target.y-d.y)<220){ d.target.takeDamage(12,d.owner.facing); spawnHitSparks(d.x,d.y,'#ffcc44'); } spawnExplosion(d.x,d.y); drones.splice(i,1); }
  }
}

/* ============ Bears ============ */
function updateBears(dt){
  for(let i=bears.length-1;i>=0;i--){
    const b=bears[i]; b.life-=dt; b.animTime+=dt;
    if(b.carrying){
      b.x += b.vx*dt;
      b.carrying.x = b.x + b.facing*35;
      b.carrying.y = b.y;
      b.carrying.state='carried';
      b.carrying.hp -= 12*dt;
      if(b.carrying.hp<=0){
        b.carrying.hp=0; b.carrying.state='ko';
        b.carrying.carried=false; b.carrying.vx=b.facing*400;
        b.carrying=null; b.life=0;
        doShake(25,0.4); playSound(100,0.6,'sawtooth',0.15);
        for(let k=0;k<3;k++) killRandomSpectator();
      }
    } else {
      b.x += b.vx*dt;
      if(!b.target.carried && b.target.hp>0){
        const hb={x:b.x+b.facing*40, y:b.y-70, r:90};
        if(circleOverlap(hb, b.target.getHurtbox())){
          b.carrying=b.target; b.target.carried=true;
          b.target.state='carried'; b.target.vx=0; b.target.vy=0;
          b.life=1.0;
          spawnHitSparks(b.x,b.y-70,'#ffaa44');
          doShake(15,0.3); playSound(80,0.3,'sawtooth',0.15);
          for(let k=0;k<2;k++) killRandomSpectator();
        }
      }
    }
    if(b.x<ARENA_LEFT+80 || b.x>ARENA_RIGHT-80) b.life=0;
    if(b.life<=0){
      if(b.carrying && !b.carrying.dead){
        b.carrying.carried=false;
        b.carrying.hitstun=0.5;
        b.carrying.state='hit';
        b.carrying.vx=b.facing*400;
        b.carrying.hp-=8;
        if(b.carrying.hp<=0){ b.carrying.hp=0; b.carrying.state='ko'; b.carrying.vx=b.facing*400; }
        spawnHitSparks(b.carrying.x, b.carrying.y-60, '#ffaa44');
        doShake(12,0.25);
      }
      bears.splice(i,1);
    }
  }
}

/* ============ Bombs ============ */
function updateBombs(dt){
  for(let i=bombs.length-1; i>=0; i--){
    const b = bombs[i];
    b.life -= dt;
    b.vy += 1400 * dt;
    b.y += b.vy * dt;
    b.x += b.vx * dt;
    b.spin += dt * 8;
    if(!b.exploded){
      const hb = {x:b.x, y:b.y, r:22};
      if(b.target && !b.target.dead && circleOverlap(hb, b.target.getHurtbox())){
        b.target.takeDamage(b.damage, Math.sign(b.vx)||1);
        b.target.hitstun = Math.max(b.target.hitstun, 0.25);
        b.exploded = true; spawnExplosion(b.x, b.y); b.life = 0;
        playSound(150,0.2,'sawtooth',0.1);
      }
      if(!b.exploded && b.y >= GROUND_Y){
        b.exploded = true; spawnExplosion(b.x, GROUND_Y); b.life = 0;
      }
      if(!b.exploded){
        for(const plat of platforms){
          if(b.x>plat.x && b.x<plat.x+plat.w && b.y>plat.y && b.y<plat.y+20){
            b.exploded = true; spawnExplosion(b.x, plat.y); b.life = 0; break;
          }
        }
      }
    }
    if(b.life<=0) bombs.splice(i,1);
  }
}

/* ============ Projectiles ============ */
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    if(p.type==='missile' && p.target && !p.target.dead){
      const dx=p.target.x-p.x, dy=(p.target.y-80)-p.y;
      const d=Math.hypot(dx,dy)||1;
      const speed=Math.min(900,200+(1-d/1000)*400);
      p.vx=dx/d*speed; p.vy=dy/d*speed;
    }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.trail.push({x:p.x,y:p.y});
    if(p.trail.length>14) p.trail.shift();

    const target = p.owner===p1 ? p2 : p1;
    let hit=false;

    if(circleOverlap({x:p.x,y:p.y,r:p.r}, target.getHurtbox())){
      if(p.type==='blockade' || p.type==='blockade_ult'){
        target.takeDamage(p.damage, Math.sign(p.vx)||1);
        if(p.type==='blockade_ult'){ target.blockadeStunTicks=3; target.blockadeStunTimer=1; }
        target.vx *= 0.3;
        target.hitstun = Math.min(target.hitstun, 0.15);
        if(target.ultTimer > 0){
          particles.push({x:target.x, y:target.y-200, vx:0, vy:-40, life:1.0, maxLife:1.0,
            color:'#88ff44', size:22, isText:true, text:'ИММУНИТЕТ!'});
        } else {
          target.blockedTimer = 5;
          particles.push({x:target.x, y:target.y-200, vx:0, vy:-40, life:1.2, maxLife:1.2,
            color:'#cc66ff', size:26, isText:true, text:'БЛОКИРОВКА!'});
        }
        spawnHitSparks(p.x, p.y, '#cc66ff');
        doShake(8,0.15);
        playSound(200,0.15,'sawtooth',0.1);
      } else if (p.type === 'flag') {
        target.takeDamage(p.damage, Math.sign(p.vx)||1);
        target.bleedTimer = p.isUltFlag ? 4.0 : 3.0;
        target.bleedTickTimer = 0.5;
        spawnHitSparks(p.x, p.y, '#d52b1e');
        doShake(8,0.15);
        playSound(400,0.1,'triangle',0.1);
      } else {
        const hpBeforeHit=target.hp;
        target.takeDamage(p.damage, Math.sign(p.vx)||1);
        if(p.type==='missile' && p.healOwnerOnHit && p.owner){ const dealt=Math.max(0,hpBeforeHit-target.hp); p.owner.hp=Math.min(p.owner.maxHp,p.owner.hp+dealt); if(dealt>0)particles.push({x:p.owner.x,y:p.owner.y-145,vx:0,vy:-35,life:0.8,maxLife:0.8,color:'#66ff88',size:20,isText:true,text:'+'+Math.ceil(dealt)+' HP'}); }
        if(p.type==='missile'){ spawnExplosion(p.x,p.y); doShake(18,0.25); flash('rgba(255,150,0,0.4)'); }
        else spawnHitSparks(p.x,p.y,p.color);
        doShake(14,0.2); hitStopTimer=0.08;
        for(const c of crowd) c.excited=2;
      }
      hit=true;
    }
    if(hit || p.x<-50 || p.x>ARENA_RIGHT+50 || p.y<-500 || p.y>900) projectiles.splice(i,1);
  }
}

/* ============ Camera ============ */
const camera = { x: 1800, y: 400, zoom: 1 };
function updateCamera(dt){
  const midX = (p1.x + p2.x) / 2;
  const dist = Math.abs(p1.x - p2.x);
  let desiredZoom = 1;
  if(dist > 800) desiredZoom = Math.max(0.45, 1 - (dist-800)/2400);
  camera.zoom += (desiredZoom - camera.zoom) * Math.min(1, dt*2.5);
  const halfViewW = (W/camera.zoom) / 2;
  const camMinX = ARENA_LEFT + halfViewW;
  const camMaxX = ARENA_RIGHT - halfViewW;
  let targetX;
  if(camMinX < camMaxX) targetX = Math.max(camMinX, Math.min(camMaxX, midX));
  else targetX = (ARENA_LEFT + ARENA_RIGHT) / 2;
  camera.x += (targetX - camera.x) * Math.min(1, dt*6);
  camera.y = 400;
}

/* ============ Draw World ============ */
function drawWorld(t){
  ctx.fillStyle = '#1a0a1a';
  for(let i=0; i<70; i++){
    const x = ARENA_LEFT + i*60 + (i%2)*25;
    const h = 50 + (i*37%90);
    ctx.fillRect(x, GROUND_Y-150-h, 48, h);
  }
  const wall = ctx.createLinearGradient(0, GROUND_Y-550, 0, GROUND_Y);
  wall.addColorStop(0,'#3a2030'); wall.addColorStop(1,'#1a0a15');
  ctx.fillStyle = wall;
  ctx.fillRect(ARENA_LEFT, GROUND_Y-550, ARENA_RIGHT-ARENA_LEFT, 550);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  for(let row=0; row<10; row++){
    for(let col=0; col<60; col++){
      const x = ARENA_LEFT + col*58 + (row%2)*29;
      const y = GROUND_Y-550 + row*55;
      if(x < ARENA_RIGHT) ctx.strokeRect(x, y, 58, 55);
    }
  }
  for(let i=0; i<18; i++){
    const tx = ARENA_LEFT + 100 + i*200;
    if(tx > ARENA_RIGHT-50) break;
    const ty = GROUND_Y - 400;
    ctx.fillStyle = '#4a3a20'; ctx.fillRect(tx-4, ty, 8, 30);
    const flick = 1 + Math.sin(t*8 + i*1.3)*0.3;
    const fg = ctx.createRadialGradient(tx, ty-10, 2, tx, ty-10, 35*flick);
    fg.addColorStop(0,'rgba(255,255,200,0.95)');
    fg.addColorStop(0.4,'rgba(255,150,40,0.7)');
    fg.addColorStop(1,'rgba(255,80,0,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(tx, ty-10, 35*flick, 0, Math.PI*2); ctx.fill();
  }
  drawCrowd(t);
  drawRefereeBackground(t);
  ctx.fillStyle = '#6a4a2a'; ctx.fillRect(ARENA_LEFT, GROUND_Y-80, ARENA_RIGHT-ARENA_LEFT, 12);
  ctx.fillStyle = '#4a2a1a'; ctx.fillRect(ARENA_LEFT, GROUND_Y-70, ARENA_RIGHT-ARENA_LEFT, 4);
  for(let x=ARENA_LEFT; x<ARENA_RIGHT; x+=60){
    ctx.fillStyle = '#5a3a20'; ctx.fillRect(x, GROUND_Y-85, 6, 22);
  }
  const floor = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y+200);
  floor.addColorStop(0,'#5a4a30'); floor.addColorStop(1,'#2a1a10');
  ctx.fillStyle = floor;
  ctx.fillRect(ARENA_LEFT, GROUND_Y, ARENA_RIGHT-ARENA_LEFT, 200);
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
  for(let i=0;i<10;i++){
    const y = GROUND_Y+10+i*15;
    ctx.beginPath(); ctx.moveTo(ARENA_LEFT, y); ctx.lineTo(ARENA_RIGHT, y); ctx.stroke();
  }
  for(let i=0; i<65; i++){
    const x = ARENA_LEFT + i*56;
    const sp = (x - 1800) * 0.8;
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y); ctx.lineTo(x+sp, GROUND_Y+200); ctx.stroke();
  }
  ctx.save(); ctx.globalAlpha = 0.12; ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 90px Impact, Arial Black, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('ARENA', 1800, GROUND_Y+100);
  ctx.restore();

  drawSprings(t);
  drawPlatforms();
}

function drawRefereeBackground(t){
  const rx = ARENA_LEFT + 300;
  const ry = GROUND_Y - 175;
  ctx.save();
  ctx.translate(rx, ry);
  ctx.translate(0, Math.sin(t*2)*1.5);
  ctx.scale(0.7, 0.7);
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(-12,-30,8,30); ctx.fillRect(4,-30,8,30);
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.roundRect(-14,-50,28,22,4); ctx.fill();
  for(let i=-5;i<=5;i++){
    ctx.fillStyle = i%2===0?'#000':'#fff';
    ctx.fillRect(i*4,-90,4,42);
  }
  ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.strokeRect(-22,-90,44,42);
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-90); ctx.lineTo(0,-78); ctx.stroke();
  ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(0,-74,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f0c090'; ctx.fillRect(-28,-88,8,25); ctx.fillRect(20,-88,8,25);
  ctx.beginPath(); ctx.arc(0,-108,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3a2010';
  ctx.beginPath(); ctx.arc(0,-113,16,Math.PI,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(5,-108,5,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(-5,-108,5,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawSprings(t){
  for(const s of springs){
    const wob = Math.sin(t*4 + s.phase)*2;
    ctx.fillStyle = '#333';
    ctx.fillRect(s.x - 32, GROUND_Y - 8, 64, 8);
    ctx.strokeStyle = '#888'; ctx.lineWidth = 4;
    for(let i=0; i<4; i++){
      const y = GROUND_Y - 12 - i*7 + wob*(i/4);
      ctx.beginPath();
      ctx.moveTo(s.x - 22, y);
      ctx.lineTo(s.x + 22, y - 4);
      ctx.stroke();
    }
    const topY = GROUND_Y - 44;
    ctx.fillStyle = '#ff4400';
    ctx.beginPath(); ctx.roundRect(s.x - 28, topY, 56, 10, 3); ctx.fill();
    ctx.strokeStyle = '#aa2200'; ctx.lineWidth = 2;
    ctx.strokeRect(s.x - 28, topY, 56, 10);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(s.x, topY - 16);
    ctx.lineTo(s.x - 10, topY - 5);
    ctx.lineTo(s.x + 10, topY - 5);
    ctx.closePath(); ctx.fill();
  }
}

function drawPlatforms(){
  for(const p of platforms){
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(p.x+8, p.y+15, p.w, 8);
    const grad = ctx.createLinearGradient(0, p.y, 0, p.y+22);
    grad.addColorStop(0,'#8a6a4a'); grad.addColorStop(1,'#4a3a20');
    ctx.fillStyle = grad;
    ctx.fillRect(p.x, p.y, p.w, 22);
    ctx.fillStyle = '#aa8a6a';
    ctx.fillRect(p.x, p.y, p.w, 5);
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(p.x+8, p.y+22, 8, 18);
    ctx.fillRect(p.x+p.w-16, p.y+22, 8, 18);
    ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, 22);
    ctx.fillStyle = '#5a9e3a';
    for(let i=0; i<6; i++){
      const gx = p.x + 10 + i * (p.w-20)/5;
      ctx.fillRect(gx, p.y - 3, 3, 4);
    }
  }
}

/* ============ Fighter drawing ============ */
function drawLimb(x1,y1,x2,y2,w,color,darkColor){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  if(len<0.5)return;
  const ang=Math.atan2(dy,dx);
  ctx.save(); ctx.translate(x1,y1); ctx.rotate(ang);
  const g=ctx.createLinearGradient(0,-w/2,0,w/2);
  g.addColorStop(0,darkColor); g.addColorStop(0.5,color); g.addColorStop(1,darkColor);
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(0,-w/2,len,w,w/2); ctx.fill();
  ctx.restore();
}

function drawFighter(f){
  const t=f.animTime || 0;
  const isUlt = f.ultTimer > 0;
  const isZombie = isUlt && f.isUkraine;
  const isCyborg = isUlt && !f.isUkraine && !f.isAmerica && !f.isChina;
  const isPatriot = isUlt && f.isAmerica;
  const isBlocked = f.blockedTimer > 0;
  const isCharging = f.ultCharging;

  const c = {
    ...f.colors,

    const ag = ctx.createRadialGradient(f.x, f.y-80, 20, f.x, f.y-80, 100 + prog*50);

    ctx.beginPath(); ctx.arc(f.x, f.y-80, 100 + prog*50, 0, Math.PI*2); ctx.fill();

}

function drawLightningEffects(){
  for(const e of lightningEffects){
    const alpha = e.life / e.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 10 * (1 - (1-alpha)*0.4);
    ctx.shadowColor = '#88ccff';
    ctx.shadowBlur = 40;
    ctx.beginPath();
    ctx.moveTo(e.x, 0);
    let cy = 0;
    while(cy < e.y-30){
      cy += 40 + Math.random()*30;
      const cx = e.x + (Math.random()-0.5)*80;
      ctx.lineTo(cx, cy);
    }
    ctx.lineTo(e.x, e.y);
    ctx.stroke();
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 3;
    ctx.shadowBlur = 20;
    for(let i=0; i<5; i++){

function drawProjectiles(){
  for(const p of projectiles){
    const isMissile=p.type==='missile';
    const isBullet=p.type==='drone_bullet';
    const isBlockade=p.type==='blockade';
    const isFlag=p.type==='flag';
    if(p.trail && p.trail.length){
      for(let i=0;i<p.trail.length;i++){
        const tr=p.trail[i]; const a=i/p.trail.length;
        ctx.globalAlpha=a*0.6; ctx.fillStyle=p.color;
        const r=isMissile?12*a:(isBullet?4*a:p.r*a);
        ctx.beginPath(); ctx.arc(tr.x,tr.y,r,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    if(isMissile){
      ctx.globalAlpha=0.4;
      const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,30);
      g.addColorStop(0,'#ffaa00'); g.addColorStop(1,'rgba(255,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,30,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle='#ff3333'; ctx.beginPath(); ctx.arc(p.x,p.y,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffaa00'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill();
      const ang=Math.atan2(p.vy,p.vx);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(ang);
      ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(20,-4); ctx.lineTo(20,4); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if(isFlag) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.PI/4 + performance.now()/200);
      ctx.scale(p.isUltFlag ? 2.25 : 1.5, p.isUltFlag ? 2.25 : 1.5);
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#d52b1e';
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#d52b1e';
      ctx.fillRect(-16, -10, 32, 20);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-16, -4, 32, 4);
      ctx.fillStyle = '#0039a6';
      ctx.fillRect(-16, -10, 14, 12);
      ctx.fillStyle = '#fff';
      for(let i=0;i<2;i++)for(let j=0;j<2;j++){
        ctx.beginPath(); ctx.arc(-12+j*6, -7+i*6, 1.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#886644';
      ctx.fillRect(14, -12, 3, 30);
      ctx.restore();
    } else if(isBlockade){
      const pulse=0.7+Math.sin(performance.now()/80)*0.3;
      ctx.globalAlpha=0.5*pulse;
      const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,40);
      g.addColorStop(0,'#cc66ff'); g.addColorStop(0.5,'rgba(180,80,255,0.5)'); g.addColorStop(1,'rgba(120,0,200,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,40,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle='#cc66ff'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#8800cc'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff88ff'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🚫', p.x, p.y);
    } else if(isBullet){
      const dir=Math.sign(p.vx)||1;
      const grad=ctx.createLinearGradient(p.x-dir*50,p.y,p.x,p.y);
      grad.addColorStop(0,'rgba(255,180,0,0)');
      grad.addColorStop(1,'rgba(255,50,0,0.95)');
      ctx.fillStyle=grad; ctx.fillRect(p.x-dir*50,p.y-2,dir*50,4);
      ctx.globalAlpha=0.5; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle='#ffaa66'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.5,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawParticles(){

function drawMiniPortrait(x, y, size, f) {

    ctx.translate(x + size/2, y + size/2);

    // Голова
    ctx.fillStyle = c.skin;

    // Щека
    ctx.fillStyle = c.skinDark;
    ctx.beginPath(); ctx.arc(-10, 8, 8, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = c.hair;

    // Ухо
    ctx.fillStyle = c.skinDark;
    ctx.beginPath(); ctx.arc(-20, 5, 5, 0, Math.PI*2); ctx.fill();
    
    // Глаз
    if (isUlt) {
        const pulse = 0.5 + Math.sin(performance.now() / 100) * 0.5;

        ctx.beginPath(); ctx.arc(11, 0, 2.5, 0, Math.PI*2); ctx.fill();

        ctx.beginPath(); ctx.arc(12, -1, 1, 0, Math.PI*2); ctx.fill();

    // Бровь
    ctx.strokeStyle = c.hair;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(5, -9); ctx.lineTo(16, -10); ctx.stroke();

            const ang = i * Math.PI * 2 / 5 - Math.PI / 2;
            ctx.lineTo(Math.cos(ang) * 6, -15 + Math.sin(ang) * 6);
        }
        ctx.closePath(); ctx.fill();
    } else if (f.charType === 'ukraine') {
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(0, -8, 24, Math.PI, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#0057b7';
        ctx.beginPath(); ctx.arc(0, -10, 16, Math.PI, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(-18, -11, 36, 3);
    } else if (f.charType === 'america') {
        ctx.fillStyle = '#d52b1e';
        ctx.fillRect(-18, -35, 36, 18);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-18, -30, 36, 5);
        ctx.fillStyle = '#0039a6';
        ctx.fillRect(-18, -20, 36, 5);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-18, -20, 36, 2);
        ctx.fillStyle = '#d52b1e';
        ctx.fillRect(-24, -15, 48, 5);
        ctx.fillStyle = '#fff';

}

    ctx.fillRect(x, y, size, size);
    ctx.strokeStyle = cd > 0 ? '#444' : '#ffd700';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, size, size);
    
    ctx.font = (size*0.55) + 'px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(icon, x + size/2, y + size/2 + 2);
    
    ctx.font = 'bold 11px Arial';
    ctx.fillStyle = '#ffd700';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(key, x + 3, y + 3);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    if (cd > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(x+1, y+1, size-2, size-2);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + (size*0.45) + 'px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(Math.ceil(cd), x + size/2, y + size/2);
    }
    if (blocked) {
        ctx.fillStyle = 'rgba(160,0,220,0.55)';
        ctx.fillRect(x+1, y+1, size-2, size-2);
        ctx.fillStyle = '#ff88ff';
        ctx.font = 'bold ' + (size*0.45) + 'px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🚫', x + size/2, y + size/2);
    }
}

// Иконка ульты
function drawUltIcon(x, y, key, isReady, isCharging, chargeTimer, chargeDuration, size) {
    ctx.fillStyle = 'rgba(10,10,20,0.9)';
    ctx.fillRect(x, y, size, size);
    
    if (isCharging) {
        const pulse = 0.5 + Math.sin(performance.now() / 100) * 0.5;
        ctx.strokeStyle = `rgba(255,100,255,${0.5 + pulse*0.5})`;
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, size, size);
        
        // Прогресс
        const prog = Math.min(1, chargeTimer / chargeDuration);
        ctx.fillStyle = 'rgba(255,0,255,0.3)';
        ctx.fillRect(x + 2, y + size - 6, (size - 4) * prog, 4);
    } else if (isReady) {
        const pulse = 0.5 + Math.sin(performance.now() / 200) * 0.5;
        ctx.save();
        ctx.globalAlpha = 0.4 + pulse * 0.3;
        ctx.fillStyle = 'rgba(255,215,0,0.6)';
        ctx.beginPath();
        ctx.arc(x + size/2, y + size/2, size*0.55, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        
        ctx.strokeStyle = `rgba(255,215,0,${0.7 + pulse*0.3})`;
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, size, size);
    } else {
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, size, size);
    }
    
    ctx.font = (size*0.6) + 'px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = isReady ? '#ffd700' : '#888';
    ctx.fillText('⚡', x + size/2, y + size/2 + 2);
    
    ctx.font = 'bold 11px Arial';
    ctx.fillStyle = '#ffd700';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(key, x + 3, y + 3);
}

// Верхняя панель бойца
function drawTopPanel(f, side) {
    const panelW = 500;
    const panelH = 155;
    const x = side === 'left' ? 20 : W - panelW - 20;
    const y = 20;
    
    ctx.save();
    
    // Фон
    const frameColor = f.isUkraine ? '#0057b7' : f.isAmerica ? '#d52b1e' : '#ffffff';
    ctx.fillStyle = 'rgba(15,10,25,0.92)';
    ctx.beginPath();
    ctx.roundRect(x, y, panelW, panelH, 10);
    ctx.fill();
    
    // Рамка
    ctx.strokeStyle = frameColor;
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Портрет
    const pSize = 110;
    const pX = side === 'left' ? x + 15 : x + panelW - pSize - 15;
    const pY = y + 15;
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(pX, pY, pSize, pSize);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.strokeRect(pX, pY, pSize, pSize);
    
    drawMiniPortrait(pX, pY, pSize, f);
    
    // Информация
    const infoX = side === 'left' ? pX + pSize + 12 : x + 12;
    const infoRight = side === 'left' ? x + panelW - 12 : pX - 12;
    const infoWidth = infoRight - infoX;
    
    // Имя
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 26px Impact, Arial Black, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(f.name.toUpperCase() + (f.isAI ? ' [ИИ]' : ''), infoX, y + 12);
    
    // HP бар
    const hpY = y + 48;
    const hpW = infoWidth;
    const hpH = 22;
    
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(infoX, hpY, hpW, hpH);
    
    const hpPct = Math.max(0, f.hp) / f.maxHp;
    const hpGrad = ctx.createLinearGradient(infoX, 0, infoX + hpW, 0);
    hpGrad.addColorStop(0, '#33bb33');
    hpGrad.addColorStop(1, '#88ff88');
    ctx.fillStyle = hpGrad;
    ctx.fillRect(infoX + 2, hpY + 2, (hpW - 4) * hpPct, hpH - 4);
    
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.strokeRect(infoX, hpY, hpW, hpH);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((Math.ceil(f.hp) + ' / ' + f.maxHp), infoX + hpW/2, hpY + hpH/2);
    
    // Статусы
    let statusY = y + 76;
    if (f.ultCharging) {
        const prog = Math.min(1, f.ultChargeTimer / f.ultChargeDuration);
        ctx.fillStyle = 'rgba(255,0,255,0.6)';
        ctx.fillRect(infoX, statusY, hpW, 10);
        ctx.fillStyle = '#ff66ff';
        ctx.fillRect(infoX + 1, statusY + 1, (hpW - 2) * prog, 8);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚡ ЗАРЯДКА УЛЬТЫ', infoX + hpW/2, statusY + 5);
        statusY += 13;
    }
    if (f.ultTimer > 0) {
        const isZ = f.isUkraine;
        const isCap = f.isAmerica;
        const col = isZ ? '#88ff44' : isCap ? '#55aaff' : '#ff4400';
        const label = isZ ? '🧟 ЗОМБИ' : isCap ? '🛡 КАПИТАН АМЕРИКА' : '🤖 КИБОРГ';
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(infoX, statusY, hpW, 10);
        ctx.fillStyle = col;
        ctx.fillRect(infoX + 1, statusY + 1, (hpW - 2) * (f.ultTimer/10), 8);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label + ' ' + Math.ceil(f.ultTimer) + 'с', infoX + hpW/2, statusY + 5);
        statusY += 13;
        if(f.isAmerica){
          ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(infoX,statusY,hpW,9);
          ctx.fillStyle=f.shieldBroken?'#666':'#55aaff';ctx.fillRect(infoX+1,statusY+1,(hpW-2)*(f.shieldHp/100),7);
          ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.fillText('ЩИТ '+Math.ceil(f.shieldHp)+'/100',infoX+hpW/2,statusY+4.5);
          statusY+=12;
        }
    }
    if (f.blockedTimer > 0) {
        ctx.fillStyle = 'rgba(80,0,120,0.85)';
        ctx.fillRect(infoX, statusY, hpW, 10);
        ctx.fillStyle = '#cc66ff';
        ctx.fillRect(infoX + 1, statusY + 1, (hpW - 2) * (f.blockedTimer/5), 8);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🚫 БЛОКИРОВКА ' + Math.ceil(f.blockedTimer) + 'с', infoX + hpW/2, statusY + 5);
    }
    
    // Скиллы
    const skills = getPlayerSkills(f);
    const iconSize = 52;
    const iconGap = 6;
    const hasUlt = true;
    const totalIcons = skills.length + (hasUlt ? 1 : 0);
    
    const iconsStartX = side === 'left' 
        ? infoX 
        : infoRight - totalIcons * (iconSize + iconGap) + iconGap;
    const iconsY = y + panelH - iconSize - 8;
    
    for (let i = 0; i < skills.length; i++) {
        const ix = iconsStartX + i * (iconSize + iconGap);
        drawSkillIconTop(ix, iconsY, skills[i].key, skills[i].icon, skills[i].cd, f.blockedTimer > 0, iconSize);
    }
    
    if (hasUlt) {
        const ultIx = iconsStartX + skills.length * (iconSize + iconGap);
        const keyLabel = f.controls.ult === 'KeyR' ? 'R' : '0';
        drawUltIcon(ultIx, iconsY, keyLabel, !f.ultUsed && !f.ultCharging, f.ultCharging, f.ultChargeTimer, f.ultChargeDuration, iconSize);
    }
    
    ctx.restore();
}

function getPlayerSkills(f){
  if(f.isUkraine){
    return [
      {key: f===p1?'Z':'N1', icon:'🛸', cd:f.skillCd.drone},
      {key: f===p1?'X':'N2', icon:'🚀', cd:f.skillCd.missile},
      {key: f===p1?'C':'N3', icon:'💣', cd:f.skillCd.bombs},
    ];
  } else if (f.isAmerica) {
    return [
      {key: f===p1?'Z':'N1', icon:'🇺🇸', cd:f.skillCd.flag},
      {key: f===p1?'X':'N2', icon:'🦅', cd:f.skillCd.eagle},
      {key: f===p1?'C':'N3', icon:'🍔', cd:f.skillCd.burger},
    ];
  } else {
    return [
      {key: f===p1?'Z':'N1', icon:'🚫', cd:f.skillCd.blockade},
      {key: f===p1?'X':'N2', icon:'🐻', cd:f.skillCd.bear},
      {key: f===p1?'C':'N3', icon:'👊', cd:f.skillCd.uppercut},
    ];
  }
}

  drawTopPanel(p1, 'left');

  // Центр — номер раунда
  ctx.textAlign='center';
  ctx.font='bold 52px Impact, Arial Black, sans-serif';

  ctx.strokeText(''+game.round, W/2, 55);

  ctx.font='bold 14px Arial'; ctx.fillStyle='#aaa';
  ctx.fillText('РАУНД', W/2, 85);
  
  // Победы в раундах
  for(let i=0;i<2;i++){

  const drawMiniIndicator = (label, ready, x, y) => {
    ctx.fillStyle = ready ? 'rgba(85,255,136,0.3)' : 'rgba(255,80,80,0.3)';
    ctx.fillRect(x, y, 55, 18);
    ctx.strokeStyle = ready ? '#55ff88' : '#ff5555';

    ctx.fillStyle = '#fff';

    ctx.fillText(label, x + 27, y + 9);

  drawMiniIndicator('DASH', p1.dashCd <= 0, 20, 185);

  drawMiniIndicator('DASH', p2.dashCd <= 0, W - 75, 185);
  drawMiniIndicator('2xJMP', !p2.doubleJumpUsed, W - 135, 185);
}

function drawMessage(){
  if(game.messageTimer<=0) return;
  const elapsed = game.messageMaxTimer - game.messageTimer;
  let a=1;
  if(elapsed<0.15) a=elapsed/0.15;
  else if(game.messageTimer<0.3) a=game.messageTimer/0.3;
  const scale = 0.6+Math.min(1,elapsed*4)*0.4;
  ctx.save();
  ctx.globalAlpha=Math.max(0,Math.min(1,a));
  ctx.translate(W/2, H/2-60); ctx.scale(scale,scale);
  ctx.font='bold 84px Impact, Arial Black, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle='#000'; ctx.lineWidth=12;
  ctx.strokeText(game.message, 0, 0);
  ctx.fillStyle='#ffd700'; ctx.fillText(game.message, 0, 0);
  ctx.restore();
}

function goToTitle(){ game.state = 'title'; game.message = ''; }
function goToSelect(){ game.state = 'select'; game.message = ''; }

function startMatch(){
  applySelections();

}
function startRound(){
  p1.reset(); p2.reset();
  p1.x=1500; p2.x=2100;
  projectiles.length=0; particles.length=0; drones.length=0; bears.length=0; bombs.length=0; eagles.length=0;

}
function endRound(winner){
  if(game.state!=='fighting') return;
  game.state='roundEnd'; game.timer=0; game.winner=winner; game.secondMsgShown=false;
  game.message = (p1.hp<=0 && p2.hp<=0) ? 'ДВОЙНОЕ K.O.' : 'K.O.';
  game.messageTimer=1.0; game.messageMaxTimer=1.0;
  if(winner===1) game.p1Wins++;
  else if(winner===2) game.p2Wins++;
  projectiles.length=0; drones.length=0; bears.length=0; bombs.length=0;
  doShake(20,0.4);

/* ============ ENTER / click handling ============ */
function handleEnter(){
  if(game.state === 'title') { game.mode = 'pvp'; goToSelect(); }
  else if(game.state === 'select') goToControls();
  else if(game.state === 'controls') startMatch();
  else if(game.state === 'matchEnd') goToSelect();
}

function handleClick(sx, sy){
  if(game.state === 'title'){
    if(hitBtn('play_pvp', sx, sy)) { game.mode = 'pvp'; goToSelect(); }
    else if(hitBtn('play_pve', sx, sy)) { game.mode = 'pve'; goToSelect(); }
  } else if(game.state === 'select'){
    if(hitBtn('p1u', sx, sy)) selections.p1 = 'ukraine';
    else if(hitBtn('p1r', sx, sy)) selections.p1 = 'russia';
    else if(hitBtn('p1a', sx, sy)) selections.p1 = 'america';
    else if(hitBtn('p2u', sx, sy)) selections.p2 = 'ukraine';
    else if(hitBtn('p2r', sx, sy)) selections.p2 = 'russia';
    else if(hitBtn('p2a', sx, sy)) selections.p2 = 'america';
    else if(hitBtn('start', sx, sy)) goToControls();
    else if(hitBtn('back', sx, sy)) goToTitle();
  } else if(game.state === 'controls'){
    if(hitBtn('start_match', sx, sy)) startMatch();
    else if(hitBtn('back_select', sx, sy)) goToSelect();
  } else if(game.state === 'matchEnd'){
    goToSelect();
  }
}

function hitBtn(id, sx, sy){
  const b = buttons[id];
  if(!b) return false;
  return sx >= b.x && sx <= b.x + b.w && sy >= b.y && sy <= b.y + b.h;
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * W;
  const sy = (e.clientY - rect.top) / rect.height * H;
  handleClick(sx, sy);
});

/* ============ Update ============ */
function updateGame(dt){
  if(game.state === 'title' || game.state === 'select' || game.state === 'controls' || game.state === 'matchEnd'){
    return;
  }
  if(hitStopTimer>0){ hitStopTimer-=dt; return; }
  game.timer+=dt;

  if(game.state==='roundStart'){
    if(game.timer>=1.5){
      game.state='fighting'; game.timer=0;
      game.message='БОЙ!'; game.messageTimer=0.8; game.messageMaxTimer=0.8;
      playSound(660,0.15,'square',0.1);
    }
  } else if(game.state==='fighting'){
    if(p1.hp<=0 || p2.hp<=0) endRound(p1.hp<=0 ? 2 : 1);
  } else if(game.state==='roundEnd'){
    if(!game.secondMsgShown && game.timer>=1.0){
      game.secondMsgShown=true;
      game.message = game.winner===0 ? 'НИЧЬЯ' : 'ИГРОК '+game.winner;
      game.messageTimer=1.5; game.messageMaxTimer=1.5;
    }
    if(game.timer>=2.5){
      if(game.p1Wins>=2 || game.p2Wins>=2){
        game.state='matchEnd'; game.timer=0;
        game.message = game.p1Wins>=2 ? 'P1 ЧЕМПИОН' : 'P2 ЧЕМПИОН';
        game.messageTimer=999; game.messageMaxTimer=999;
        for(const c of crowd) c.excited=3;
      } else { game.round++; startRound(); }
    }
  }

  const allow = game.state==='fighting';
  
  if (game.mode === 'pve' && p2.isAI && allow) {
      p2.aiTimer -= dt;
      if (p2.aiTimer <= 0) {
          p2.aiTimer = 0.1 + Math.random() * 0.15;
          updateAI(p2, p1);
      }
  }
  
  p1.update(dt, p2, allow);
  p2.update(dt, p1, allow);

  // Коллизия — фикс перепрыгивания
  const dy = Math.abs(p1.y - p2.y);
  if(!p1.carried && !p2.carried && Math.abs(p1.x-p2.x)<60 && dy < 70 && p1.dashTimer<=0 && p2.dashTimer<=0){
    const mid=(p1.x+p2.x)/2;
    if(p1.x<p2.x){ p1.x=mid-30; p2.x=mid+30; }
    else { p1.x=mid+30; p2.x=mid-30; }
    p1.clampX(); p2.clampX();
  }

  updateProjectiles(dt);
  updateDrones(dt);
  updateBears(dt);
  updateBombs(dt);
  updateEagles(dt);
  updateParticles(dt);
  updateCamera(dt);

  for(const f of [p1, p2]){
    for(let i=f.dashTrail.length-1; i>=0; i--){
      f.dashTrail[i].life -= dt;
      if(f.dashTrail[i].life <= 0) f.dashTrail.splice(i, 1);
    }
  }

  if(game.messageTimer>0) game.messageTimer-=dt;
  if(screenShake.timer>0) screenShake.timer-=dt;
  if(screenFlash>0) screenFlash-=dt;

  for(const c of crowd){
    c.excited = Math.max(0, c.excited-dt*1.5);
    if(!c.alive) c.deathTimer-=dt;
  }
}

/* ============ Render ============ */

    drawTitleScreen();

  }

  }

    const s=screenShake.intensity*(screenShake.timer/screenShake.duration);

  drawMessage();

  if(game.state==='matchEnd'){

    if(Math.floor(performance.now()/500)%2===0){

      ctx.fillText('Нажмите R или кликните для выбора персонажей', W/2, H-100);
    }
  }
}

/* ============ Loop ============ */
let lastTime=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastTime) lastTime=now;
  let dt=(now-lastTime)/1000;
  lastTime=now;
  if(dt>0.1) dt=0.1;
  updateGame(dt);
  render();
}

  }
  // F/G attacks can chip the grave; five successful melee hits destroy it.
  for(const t of tombstones){for(const attacker of [p1,p2]){if(attacker===t.owner)continue;const a=attacker.attack;if(a&&!a.hasHit&&(a.type==='punch'||a.type==='kick')){const cfg=ATTACKS[a.type];if(a.timer>=a.startupEnd&&a.timer<a.activeEnd&&Math.abs(attacker.x-t.x)<cfg.range+40&&Math.abs(attacker.y-t.y)<90){t.hp--;a.hasHit=true;spawnHitSparks(t.x,t.y-50,'#aaff77');}}}}

  for(let i=miniZombies.length-1;i>=0;i--){const z=miniZombies[i];z.life-=dt;z.timer+=dt;
    if(z.state==='run'&&z.target&&z.target.hp>0){const dx=z.target.x-z.x;z.vx=Math.sign(dx)*185;z.x+=z.vx*dt;if(Math.abs(dx)<62&&Math.abs(z.target.y-z.y)<90){z.state='windup';z.timer=0;}}

}

    if(z.state==='run'&&z.target&&z.target.hp>0){const dx=z.target.x-z.x;z.vx=Math.sign(dx)*185;z.x+=z.vx*dt;if(Math.abs(dx)<62&&Math.abs(z.target.y-z.y)<90){z.state='windup';z.timer=0;}}
    else if(z.state==='windup'&&z.timer>=.5){z.state='jump';z.timer=0;z.jumpAge=0;z.jumpStartX=z.x;z.jumpDuration=.42;}
    else if(z.state==='jump'){z.jumpAge+=dt;const pr=Math.min(1,z.jumpAge/z.jumpDuration);if(z.target&&z.target.hp>0){z.x=z.jumpStartX+(z.target.x-z.jumpStartX)*pr;}z.y=GROUND_Y-Math.sin(pr*Math.PI)*95;if(pr>=1){if(z.target&&z.target.hp>0){z.x=z.target.x;z.target.takeDamage(5,z.owner.x<z.target.x?1:-1);}z.state='explode';z.timer=0;z.y=GROUND_Y;}}
    else if(z.state==='explode'&&!z.hit){spawnExplosion(z.x,GROUND_Y-35);z.hit=true;z.life=0;}
    if(z.life<=0)miniZombies.splice(i,1);
  }
};

// Ultimate Russian bear: grab, drag the opponent forward, then bite while they remain stunned.
const sbPriorUpdateBears18=updateBears;
updateBears=function(dt){
  const special=bears.filter(b=>b.isUlt);for(let i=bears.length-1;i>=0;i--)if(bears[i].isUlt)bears.splice(i,1);
  sbPriorUpdateBears18(dt);
  for(const b of special){b.animTime+=dt;b.life-=dt;
    if(b.phase==='run'){b.x+=b.vx*dt;if(b.target&&b.target.hp>0&&!b.target.carried&&circleOverlap({x:b.x+b.facing*55,y:b.y-80,r:110},b.target.getHurtbox())){b.carrying=b.target;b.target.carried=true;b.target.state='carried';b.target.vx=0;b.target.vy=0;b.phase='drag';b.dragTimer=.55;b.biteTimer=1.5;b.biteTick=.5;b.vx=b.facing*430;spawnHitSparks(b.x,b.y-80,'#ffb45b');doShake(8,.2);}}
    else if(b.phase==='drag'&&b.carrying){b.dragTimer-=dt;b.x+=b.vx*dt;b.carrying.x=b.x+b.facing*45;b.carrying.y=b.y;b.carrying.carried=true;if(b.dragTimer<=0){b.phase='bite';b.vx=0;sbSparkText(b.x,b.y-160,'КУСЬ!','#ffb45b');}}
    else if(b.phase==='bite'&&b.carrying){b.biteTimer-=dt;b.biteTick-=dt;b.carrying.x=b.x+b.facing*45;b.carrying.y=b.y;b.carrying.carried=true;if(b.biteTick<=0){b.biteTick=.5;b.carrying.takeDamage(5,b.facing);spawnHitSparks(b.carrying.x,b.carrying.y-65,'#ffb45b');}if(b.biteTimer<=0){b.carrying.carried=false;b.carrying.hitstun=.35;b.carrying.vx=b.facing*420;b.carrying=null;b.life=0;}}
    if(b.life<=0){if(b.carrying){b.carrying.carried=false;b.carrying.hitstun=.35;b.carrying.vx=b.facing*420;} }else bears.push(b);
  }
};

function cnInit(f) {
  if (f._cnInit) return;
  f._cnInit = true;
  f.noodleCharges = 0;
  f.noodleMode = false;
  f.fireworkCd = 0;
  f.lanternCd = 0;
  f.breathCd = 0;
  f.tailCd = 0;
  f.roarCd = 0;
  f._cnZHeld = false;
  f._cnXHeld = false;
  f._cnCHeld = false;
  f.burnTimer = 0;
  f.burnInterval = 0;
  f.burnDmg = 0;
  f.burnTicksLeft = 0;
  f.slowTimer = 0;
  if (!f.skillCd.noodle) f.skillCd.noodle = 0;
}

cnInit(p1); cnInit(p2);

/* ==== RESET ==== */
const cnResetPrev = Fighter.prototype.reset;
Fighter.prototype.reset = function () {
  cnResetPrev.call(this);
  this._cnInit = false;
  cnInit(this);
  this.skillCd.noodle = 0;
};

/* ==== UPDATE WRAPPER ==== */
const cnUpdatePrev = Fighter.prototype.update;
Fighter.prototype.update = function (dt, opponent, allowInput) {
  cnUpdatePrev.call(this, dt, opponent, allowInput);
  if (!this.isChina || this.trainingDummy) return;
  cnInit(this);

  // Tick CDs (skillCd.noodle сам уменьшается в базе, не дублируем)
  this.fireworkCd = Math.max(0, this.fireworkCd - dt);
  this.lanternCd  = Math.max(0, this.lanternCd  - dt);
  this.breathCd   = Math.max(0, this.breathCd   - dt);
  this.tailCd     = Math.max(0, this.tailCd     - dt);
  this.roarCd     = Math.max(0, this.roarCd     - dt);

  // Горение
  if (this.burnTimer > 0) {
    this.burnTimer -= dt;
    this.burnInterval -= dt;
    if (this.burnInterval <= 0) {
      this.burnInterval = 1;
      this.takeDamage(this.burnDmg, -this.facing);
      spawnHitSparks(this.x, this.y - 80, '#ff6600');
      this.burnTicksLeft--;
      if (this.burnTicksLeft <= 0) this.burnTimer = 0;
    }
  }

  // Замедление (сдвигаем назад половину vx)
  if (this.slowTimer > 0) {
    this.slowTimer -= dt;
    this.x -= this.vx * 0.5 * dt;
    this.clampX();
  }

  // Нельзя кастовать в ульте-зарядке / стане / переноске
  if (!allowInput || this.hitstun > 0 || this.carried || this.hp <= 0 || this.ultCharging) return;

  const zDown = this.isDown(this.controls.skill1);
  const xDown = this.isDown(this.controls.skill2);
  const cDown = this.isDown(this.controls.skill3);

  if (this.ultTimer > 0) {
    // === ДРАКОН: Z / X / C ===
    if (zDown && !this._cnZHeld && this.breathCd <= 0) {
      this.cnBreath(opponent); this.breathCd = 3; this._cnZHeld = true;
    }
    if (!zDown) this._cnZHeld = false;

    if (xDown && !this._cnXHeld && this.tailCd <= 0) {
      this.cnTail(opponent); this.tailCd = 4; this._cnXHeld = true;
    }
    if (!xDown) this._cnXHeld = false;

    if (cDown && !this._cnCHeld && this.roarCd <= 0) {
      this.cnRoar(opponent); this.roarCd = 5; this._cnCHeld = true;
    }
    if (!cDown) this._cnCHeld = false;
  } else {
    // === ОБЫЧНЫЕ: Z / X / C ===
    if (zDown && !this._cnZHeld) {
      this._cnZHeld = true;
      if (this.noodleCharges === 0 && this.skillCd.noodle <= 0) {
        this.noodleCharges = 5;
        this.noodleMode = true;
        cnText(this.x, this.y - 200, '🍜 ДОШИРАК x5', '#ff8844');
        playSound(600, 0.15, 'sine', 0.08);
      } else if (this.noodleCharges > 0) {
        this.cnNoodleShot(opponent);
        this.noodleCharges--;
        if (this.noodleCharges === 0) {
          this.noodleMode = false;
          this.skillCd.noodle = 15;
          particles.push({ x: this.x + this.facing * 30, y: this.y - 90, vx: this.facing * 250, vy: -300, life: 0.8, maxLife: 0.8, color: '#ff6600', size: 12, gravity: 1200 });
          cnText(this.x, this.y - 160, 'ПУСТО!', '#ffaa44');
        }
      }
    }
    if (!zDown) this._cnZHeld = false;

    if (xDown && !this._cnXHeld && this.fireworkCd <= 0) {
      this.cnFirework(opponent); this.fireworkCd = 5; this._cnXHeld = true;
    }
    if (!xDown) this._cnXHeld = false;

    if (cDown && !this._cnCHeld && this.lanternCd <= 0) {
      this.cnLantern(opponent); this.lanternCd = 10; this._cnCHeld = true;
    }
    if (!cDown) this._cnCHeld = false;
  }
};
