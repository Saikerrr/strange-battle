/* ==== UPDATE PROJECTILES ==== */
function cnUpdateProjectiles(dt) {
  // Лапша
  for (let i = cnNoodle.length - 1; i >= 0; i--) {
    const n = cnNoodle[i];
    n.life -= dt; n.x += n.vx * dt; n.y += n.vy * dt;
    n.trail.push({ x: n.x, y: n.y });
    if (n.trail.length > 10) n.trail.shift();
    const t = n.target;
    if (t && t.hp > 0 && !t.carried && Math.hypot(n.x - t.x, n.y - (t.y - 80)) < 50) {
      t.takeDamage(n.damage, n.owner.facing);
      spawnHitSparks(n.x, n.y, '#ffcc00');
      cnNoodle.splice(i, 1);
      continue;
    }
    if (n.life <= 0 || n.x < ARENA_LEFT || n.x > ARENA_RIGHT) cnNoodle.splice(i, 1);
  }

  // Фейерверк
  for (let i = cnFireworks.length - 1; i >= 0; i--) {
    const f = cnFireworks[i];
    f.age += dt;
    const p = Math.min(1, f.age / f.duration);
    f.x = f.x0 + (f.tx - f.x0) * p;
    f.y = f.y0 + (f.ty - f.y0) * p - Math.sin(p * Math.PI) * 220;
    if (p >= 1) {
      const colors = ['#ff0044', '#ffcc00', '#00ccff', '#cc00ff', '#00ff88', '#ff6600'];
      for (let b = 0; b < 3; b++) {
        setTimeout(() => {
          for (let j = 0; j < 20; j++) {
            const a = Math.random() * Math.PI * 2, s = 150 + Math.random() * 300;
            particles.push({
              x: f.tx, y: f.ty,
              vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100,
              life: 1.0 + Math.random() * 0.5, maxLife: 1.5,
              color: colors[Math.floor(Math.random() * colors.length)],
              size: 4 + Math.random() * 6, gravity: 400
            });
          }
        }, b * 150);
      }
      const t = f.target;
      if (t && t.hp > 0 && Math.hypot(t.x - f.tx, t.y - 80 - f.ty) < f.radius) {
        t.takeDamage(f.damage, f.owner.facing);
      }
      doShake(8, 0.2);
      playSound(1200, 0.1, 'triangle', 0.1);
      cnFireworks.splice(i, 1);
    }
  }

  // Фонарь
  for (let i = cnLanterns.length - 1; i >= 0; i--) {
    const l = cnLanterns[i];
    l.life -= dt; l.age += dt; l.fireCd -= dt;
    if (l.life <= 0) { cnLanterns.splice(i, 1); continue; }
    if (l.fireCd <= 0) {
      l.fireCd = 0.6;
      const enemy = (l.owner === p1) ? p2 : p1;
      if (enemy && enemy.hp > 0 && Math.hypot(enemy.x - l.x, (enemy.y - 80) - (l.y - 100)) < l.radius) {
        const dx = enemy.x - l.x, dy = (enemy.y - 80) - (l.y - 100);
        const d = Math.max(0.1, Math.hypot(dx, dy));
        cnNoodle.push({
          x: l.x, y: l.y - 100,
          vx: dx / d * 800, vy: dy / d * 800,
          r: 6, damage: 3, life: 1.5,
          owner: l.owner, target: enemy, trail: []
        });
        playSound(1400, 0.04, 'square', 0.05);
      }
    }
  }

  // Дыхание
  for (let i = cnFireCones.length - 1; i >= 0; i--) {
    const c = cnFireCones[i];
    c.life -= dt;
    if (c.life <= 0) { cnFireCones.splice(i, 1); continue; }
    const t = (c.owner === p1) ? p2 : p1;
    if (t && t.hp > 0 && !c.hit.has(t)) {
      const along = (t.x - c.owner.x) * c.dir;
      const perp = Math.abs((t.y - 80) - (c.owner.y - 80));
      if (along > 0 && along < c.length && perp < c.width / 2) {
        c.hit.add(t);
        t.takeDamage(15, c.dir);
        t.burnTimer = 3;
        t.burnInterval = 1;
        t.burnDmg = 3;
        t.burnTicksLeft = 3;
        spawnHitSparks(t.x, t.y - 80, '#ff4400');
      }
    }
  }

  for (let i = cnTails.length - 1; i >= 0; i--) { cnTails[i].life -= dt; if (cnTails[i].life <= 0) cnTails.splice(i, 1); }
  for (let i = cnRoars.length - 1; i >= 0; i--) { cnRoars[i].life -= dt; if (cnRoars[i].life <= 0) cnRoars.splice(i, 1); }
}

/* ==== DRAW PROJECTILES ==== */
function cnDrawProjectiles() {
  // Лапша
  for (const n of cnNoodle) {
    for (let i = 0; i < n.trail.length; i++) {
      ctx.globalAlpha = (i / n.trail.length) * 0.5;
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath(); ctx.arc(n.trail[i].x, n.trail[i].y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(n.x, n.y);
    ctx.rotate(Math.atan2(n.vy, n.vx));
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = -15; i <= 15; i += 3) {
      const yy = Math.sin(i * 0.5 + performance.now() * 0.02) * 3;
      if (i === -15) ctx.moveTo(i, yy); else ctx.lineTo(i, yy);
    }
    ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  // Фейерверк
  for (const f of cnFireworks) {
    ctx.save(); ctx.translate(f.x, f.y);
    ctx.globalAlpha = 0.4; ctx.fillStyle = '#ff6600';
    for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(-i * 8, i * 10, 6 - i, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Фонарь
  for (const l of cnLanterns) {
    const bob = Math.sin(l.age * 3) * 5;
    ctx.save(); ctx.translate(l.x, l.y - 100 + bob);
    const glow = ctx.createRadialGradient(0, 0, 20, 0, 0, l.radius);
    glow.addColorStop(0, 'rgba(255,180,0,0.25)');
    glow.addColorStop(0.5, 'rgba(255,120,0,0.1)');
    glow.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, l.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#cc1100'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 30, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(0, 0, 15, 22, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#ffcc00'; ctx.fillRect(-8, -32, 16, 4); ctx.fillRect(-8, 28, 16, 4);
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 32); ctx.lineTo(0, 45); ctx.stroke();
    ctx.restore();
  }

  // Конус дыхания
  for (const c of cnFireCones) {
    const a = c.life / c.maxLife;
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(c.owner.x, c.owner.y - 80); ctx.scale(c.dir, 1);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, c.length);
    grad.addColorStop(0, 'rgba(255,255,100,0.9)');
    grad.addColorStop(0.4, 'rgba(255,150,0,0.6)');
    grad.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(c.length, -c.width / 2); ctx.lineTo(c.length, c.width / 2); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 12; i++) {
      const px = Math.random() * c.length;
      const py = (Math.random() - 0.5) * c.width * (px / c.length);
      ctx.fillStyle = `rgba(255,${180 + Math.random() * 75},0,${a})`;
      ctx.beginPath(); ctx.arc(px, py, 3 + Math.random() * 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // Хвост
  for (const t of cnTails) {
    const a = t.life / t.maxLife;
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.radius * (1 - a * 0.5), 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.radius * (1 - a * 0.5), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // Рёв
  for (const r of cnRoars) {
    const a = r.life / r.maxLife;
    ctx.save(); ctx.globalAlpha = a;
    for (let ring = 0; ring < 3; ring++) {
      const rr = r.radius * (1 - a * 0.5) + ring * 40;
      ctx.strokeStyle = `rgba(255,215,0,${a})`;
      ctx.lineWidth = 4 - ring;
      ctx.beginPath(); ctx.arc(r.x, r.y, rr, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
}

/* ==== HOOK UPDATE / DRAW ==== */
const cnUpdateGamePrev = updateGame;
updateGame = function (dt) {
  cnUpdateGamePrev(dt);
  if (game.state === 'fighting') cnUpdateProjectiles(dt);
};

const cnDrawWorldPrev = drawWorld;
drawWorld = function (t) {
  cnDrawWorldPrev(t);
  cnDrawProjectiles();
};

/* ==== SKILLS ICONS ==== */
const cnSkillsPrev = getPlayerSkills;
getPlayerSkills = function (f) {
  if (f.isChina) {
    if (f.ultTimer > 0) {
      return [
        { key: f === p1 ? 'Z' : 'N1', icon: '🔥', cd: f.breathCd || 0 },
        { key: f === p1 ? 'X' : 'N2', icon: '🌀', cd: f.tailCd || 0 },
        { key: f === p1 ? 'C' : 'N3', icon: '📢', cd: f.roarCd || 0 }
      ];
    }
    const zCd = f.noodleMode ? 0 : (f.skillCd.noodle || 0);
    const zIcon = f.noodleMode ? ('🍜' + f.noodleCharges) : '🍜';
    return [
      { key: f === p1 ? 'Z' : 'N1', icon: zIcon, cd: zCd },
      { key: f === p1 ? 'X' : 'N2', icon: '🎆', cd: f.fireworkCd || 0 },
      { key: f === p1 ? 'C' : 'N3', icon: '🏮', cd: f.lanternCd || 0 }
    ];
  }
  return cnSkillsPrev(f);
};

/* ==== DRAGON VISUAL + NOODLE ==== */
const cnDrawFighterPrev = drawFighter;
drawFighter = function (f) {
  cnDrawFighterPrev(f);
  if (!f.isChina) return;

  // Доширак в руке
  if (f.noodleMode && f.noodleCharges > 0 && f.ultTimer <= 0 && !f.trainingDummy) {
    ctx.save();
    ctx.translate(f.x + f.facing * 42, f.y - 85);
    ctx.scale(f.facing, 1);
    ctx.fillStyle = '#ff6600';
    ctx.beginPath(); ctx.roundRect(-12, -15, 24, 30, 3); ctx.fill();
    ctx.strokeStyle = '#cc3300'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffaa44'; ctx.fillRect(-12, -15, 24, 6);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('D', 0, 4);
    ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 12px Arial';
    ctx.fillText('x' + f.noodleCharges, 22, -12);
    ctx.restore();
  }

  // Дракон
  if (f.ultTimer > 0) {
    const t = performance.now();
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(f.facing, 1);

    // Хвост
    const tail = Math.sin(t * 0.008) * 8;
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -60);
    ctx.quadraticCurveTo(-70, -30 + tail, -110, -80 + tail); ctx.stroke();
    ctx.strokeStyle = '#aa8800'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#ff6600';
    ctx.beginPath(); ctx.arc(-110, -80 + tail, 10, 0, Math.PI * 2); ctx.fill();

    // Дальнее крыло
    const wp = Math.sin(t * 0.01);
    ctx.save(); ctx.translate(-20, -110); ctx.rotate(-0.7 + wp * 0.3);
    ctx.fillStyle = 'rgba(255,180,0,0.6)';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-60, -40, -90, 0);
    ctx.quadraticCurveTo(-70, 25, -40, 20); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#aa6600'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    // Ближнее крыло
    ctx.save(); ctx.translate(-20, -110); ctx.rotate(-0.5 + wp * 0.3);
    ctx.fillStyle = 'rgba(255,215,0,0.7)';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-50, -30, -80, -10);
    ctx.quadraticCurveTo(-70, 20, -50, 30); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#aa6600'; ctx.lineWidth = 2; ctx.stroke();
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60 + i * 15, -20 + i * 12); ctx.stroke();
    }
    ctx.restore();

    // Чешуя
    ctx.strokeStyle = 'rgba(255,215,0,0.5)'; ctx.lineWidth = 1;
    for (let y = -140; y < -80; y += 15) {
      for (let x = -15; x < 15; x += 10) {
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI); ctx.stroke();
      }
    }
    ctx.restore();

    // Золотая аура
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(t * 0.01) * 0.15;
    const ag = ctx.createRadialGradient(f.x, f.y - 100, 20, f.x, f.y - 100, 180);
    ag.addColorStop(0, 'rgba(255,215,0,0.5)');
    ag.addColorStop(1, 'rgba(255,180,0,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(f.x, f.y - 100, 180, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
};

/* ==== ОПИСАНИЕ ==== */
sbDescription = (function (prev) {
  return function (id) {
    if (id === 'china') {
      return {
        skills: [
          ['Z · ДОШИРАК', 'Берёт доширак, получает 5 зарядов. Каждое нажатие — выстрел лапшой по 5 урона. Кд 15 сек после всех выстрелов.'],
          ['X · ФЕЙЕРВЕРК', 'Запускает фейерверк по дуге. Взрыв 10 урона в радиусе 130. Кд 5 сек.'],
          ['C · БУМАЖНЫЙ ФОНАРЬ', 'Ставит фонарь на 4 сек. Стреляет огоньками (3 урона) каждые 0.6 сек по ближайшему врагу. Кд 10 сек.']
        ],
        ult: 'На 10 сек превращается в крылатого дракона: +20% HP, крылья, чешуя. Z — Дыхание (15 + поджог), X — Хвост (12 + оглушение), C — Рёв (8 + замедление).'
      };
    }
    return prev(id);
  };
})(sbDescription);

/* ==== ТИЗЕР НА КАРТОЧКЕ ==== */
const cnDrawCharCardPrev = drawCharCard;
drawCharCard = function (x, y, w, h, charId, selected, btnId) {
  cnDrawCharCardPrev(x, y, w, h, charId, selected, btnId);
  if (charId === 'china') {
    ctx.save();
    ctx.fillStyle = 'rgba(15,10,25,0.92)';
    ctx.fillRect(x + 15, y + 65, w - 30, 32);
    ctx.fillStyle = '#ddd'; ctx.font = '12px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('🍜 Доширак · 🎆 Фейерверк · 🏮 Фонарь', x + 20, y + 75);
    ctx.fillStyle = '#ffcf3c';
    ctx.fillText('🐉 УЛЬТ: превращение в дракона', x + 20, y + 92);
    ctx.restore();
  }
};

/* ==== ИИ КИТАЯ (простенький) ==== */
const cnAIPrev = updateAI;
updateAI = function (ai, player) {
  if (ai.isChina) {
    ai.aiKeys = {};
    if (ai.hp <= 0 || ai.state === 'hit' || ai.state === 'ko' || ai.carried || ai.ultCharging) return;
    const dx = player.x - ai.x;
    const dist = Math.abs(dx);
    const dir = dx > 0 ? 1 : -1;

    // Ульта при <50% HP
    if (!ai.ultUsed && ai.ultCooldown <= 0 && ai.hp < ai.maxHp * 0.5 && Math.random() < 0.02) {
      ai.aiKeys['Numpad0'] = true;
      return;
    }

    if (ai.ultTimer > 0) {
      // Дракон: Z (дыхание) если близко, X (хвост) в упор, C (рёв) в среднем радиусе
      if (dist < 200 && ai.tailCd <= 0 && Math.random() < 0.6) { ai.aiKeys['Numpad2'] = true; }
      else if (dist < 280 && ai.roarCd <= 0 && Math.random() < 0.4) { ai.aiKeys['Numpad3'] = true; }
      else if (dist > 150 && dist < 420 && ai.breathCd <= 0 && Math.random() < 0.5) { ai.aiKeys['Numpad1'] = true; }
    } else {
      // Обычные: доширак если есть заряды, фейерверк на средней дистанции, фонарь если далеко
      if (ai.noodleCharges > 0 && Math.random() < 0.3) { ai.aiKeys['Numpad1'] = true; }
      else if (dist > 250 && ai.fireworkCd <= 0 && Math.random() < 0.2) { ai.aiKeys['Numpad2'] = true; }
      else if (ai.lanternCd <= 0 && dist > 300 && Math.random() < 0.03) { ai.aiKeys['Numpad3'] = true; }
      else if (ai.skillCd.noodle <= 0 && ai.noodleCharges === 0 && dist < 400 && Math.random() < 0.02) { ai.aiKeys['Numpad1'] = true; }
    }

    if (dist < 95 && !ai.attack && Math.random() < 0.4) {
      if (Math.random() < 0.5) ai.aiKeys['Numpad4'] = true; else ai.aiKeys['Numpad5'] = true;
    }

    if (!ai.attack && !ai.blocking) {
      if (dist > 90) {
        if (dir > 0) ai.aiKeys['ArrowRight'] = true; else ai.aiKeys['ArrowLeft'] = true;
        if (Math.random() < 0.05 && ai.onGround) ai.aiKeys['ArrowUp'] = true;
        if (Math.random() < 0.05 && ai.dashCd <= 0) ai.aiKeys['ShiftRight'] = true;
      }
    }
    return;
  }
  cnAIPrev(ai, player);
};
})();
